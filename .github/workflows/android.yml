name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "core/**", "scripts/build-core-android.sh", "Cargo.toml", "Cargo.lock", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "core/**", "scripts/build-core-android.sh", "Cargo.toml", "Cargo.lock", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-${{ hashFiles('Cargo.lock') }}
      - name: Rust for Android
        run: |
          rustup target add aarch64-linux-android
          command -v cargo-ndk || cargo install cargo-ndk --locked
      - name: Build and test
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: tallycam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
