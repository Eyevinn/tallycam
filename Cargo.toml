# Rust workspace for the shared core (clock discipline, LCP SEI, MPEG-TS,
# genlock, LCP protocol types), its SRT caller (core/srt), its iOS FFI wrapper,
# the hub library, the clock probe and the SRT interop tool (tools/srt-spike).
#
# control-hub (the standalone hub binary) keeps its own Cargo.lock and target
# directory and depends on the core and the hub library by path. sync-probe and fake-camera are standalone tools.
[workspace]
resolver = "2"
members = ["core", "core/ffi", "core/srt", "core/android", "hub", "tools/clockd-probe", "tools/srt-spike"]
exclude = ["control-hub", "tools/sync-probe", "tools/fake-camera"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.1"

[profile.release]
debug = 1
# The core runs per frame and per packet on the phone; whole-program
# optimisation across the core, SRT and srt-protocol crates.
lto = "fat"
codegen-units = 1
