[package]
name = "tallycam-core-ffi"
description = "iOS/Swift bindings of the TallyCam core: UniFFI for the clock service, a small C ABI for per-frame calls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "tallycam_core_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
tallycam-core = { path = "..", features = ["driver"] }
tallycam-srt = { path = "../srt" }
uniffi = "0.32.2"
serde_json = "1"
