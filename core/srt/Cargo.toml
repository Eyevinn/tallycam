[package]
name = "tallycam-srt"
description = "SRT caller sender for TallyCam: the pure-Rust srt-protocol engine driven by one thread with its own UDP socket, with adaptive bitrate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Adaptive bitrate (bitrate::adaptive), pure: no driver.
tallycam-core = { path = "..", default-features = false }
srt-protocol = "0.4.4"
bytes = "1"
rand = "0.8"
# debug and trace (ours and srt-protocol's, per packet) compiled out of
# release builds; info and above stay.
log = { version = "0.4", features = ["release_max_level_info"] }
libc = "0.2"
