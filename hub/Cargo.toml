[package]
name = "tallycam-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TallyCam camera hub: device registry, tally, preview gating and provisioning for the LCP protocol"
publish = false

[features]
default = []
# LAN address discovery for the advertised URLs.
lan = ["dep:if-addrs"]
# The "scan to connect" QR code as SVG.
qr = ["dep:qrcode"]
# Axum routes, WebSocket sessions and the operator web UI. The standalone
# hub uses all of it; an embedding server (Strom) may mount the sessions
# behind its own routes instead.
server = ["lan", "qr", "dep:axum", "dep:futures-util", "tokio/time", "tokio/macros", "tokio/rt"]

[dependencies]
# Device protocol types (shared with the apps).
tallycam-core = { path = "../core" }
tokio = { version = "1", features = ["sync", "time"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
if-addrs = { version = "0.13", optional = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
