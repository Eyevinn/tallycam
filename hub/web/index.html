    const status = el("span", { class: "copied" });
    const flash = text => {
      status.textContent = text;
      clearTimeout(status._timer);
      status._timer = setTimeout(() => { status.textContent = ""; }, 2500);
    };
    const subject = "Join as a camera";
    const body = "Open this link on the phone that will be the camera (TallyCam must be installed):\n\n" + join +
      (t.expires_in_secs ? "\n\nThe link works for one phone and expires in " + Math.round(t.expires_in_secs / 60) + " minutes." : "");
    rows.push(el("dt", {}, "Link"), el("dd", {},
      el("div", {}, el("code", {}, join)),
      el("div", { class: "share" },
        el("button", {
          type: "button", class: "btn",
          onclick: async () => {
            flash(await copyText(join) ? "Copied" : "Copy failed: select the link and copy it");
          },
        }, "Copy link"),
        el("button", {
          type: "button", class: "btn",
          onclick: async () => {
            if (navigator.share) {
              try { await navigator.share({ title: subject, text: body }); } catch (e) { /* cancelled */ }
            } else {
              location.href = "mailto:?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
            }
          },
        }, navigator.share ? "Share..." : "E-mail..."),
        status)));
  }
  const card = el("div", { class: "add" },
    closable ? el("button", { class: "btn close", type: "button", onclick: closeAdd, title: "Close (Esc)" }, "Close") : null,
    qr,
    el("div", { class: "info" },
      el("h2", {}, "Add a camera"),
      el("ol", {},
        el("li", {}, "Install TallyCam on the phone."),
        el("li", {}, t && !isLocalUrl(t.control_url)
          ? "Any internet connection on the phone: Wi-Fi or mobile data."
          : "The phone on the same network as this hub: the same Wi-Fi, or a cable on the same network."),
        el("li", {}, "Scan the code with the phone's camera, or send it the link below, and open it in TallyCam.")),
      el("dl", {}, rows),
      t && t.srt_url && t.srt_url.includes("{device}")
        ? el("div", { class: "note" }, "The phone replaces {device} with its own stream id (cam- and the start of its device id).")
        : null,
      t && t.expires_in_secs
        ? el("div", { class: "note" }, "The code admits one new phone and expires in " +
            Math.round(t.expires_in_secs / 60) + " minutes. The phone gets its stream address when it is used in a flow.")
        : null));
  return card;
}

// True for an address only reachable on the local network (private,
// link-local or .local): the phone must then be on that network. A public
// address (--public-url, a proxy) works over any connection, 5G included.
function isLocalUrl(url) {
  let host;
  try { host = new URL(url).hostname.replace(/^\[|\]$/g, "").toLowerCase(); } catch (e) { return true; }
  if (host === "localhost" || host.endsWith(".local")) return true;
  const v4 = host.match(/^(\d+)\.(\d+)\.\d+\.\d+$/);
  if (v4) {
    const [a, b] = [Number(v4[1]), Number(v4[2])];
    return a === 10 || a === 127 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168)
      || (a === 169 && b === 254) || (a === 100 && b >= 64 && b <= 127);
  }
  // IPv6: unique local (fc00::/7) and link-local (fe80::/10).
  return /^f[cd]/.test(host) || /^fe[89ab]/.test(host);
}

// Copies text. The clipboard API needs a secure context (https or
// localhost); the page is often opened over http on a LAN address, so fall
// back to a selected textarea.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const area = el("textarea", { readonly: "" });
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.append(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { /* not allowed */ }
    area.remove();
    return ok;
  }
}

// A clickable http(s) link to the join page that opens `t.deep_link` in the
// app, on the control URL's host (which the phone can reach), or null.
function joinLink(t) {
  if (!CONFIG.joinPath || !t.deep_link || !t.control_url) return null;
  try {
    const u = new URL(t.control_url);
    const scheme = u.protocol === "wss:" ? "https:" : "http:";
    return scheme + "//" + u.host + CONFIG.joinPath + "#" + encodeURIComponent(t.deep_link);
  } catch (e) {
    return null;
  }
}

function renderAddCards() {
  document.getElementById("empty").replaceChildren(buildAddCard(false));
  const modal = document.getElementById("modal");
  if (!modal.hidden) modal.replaceChildren(buildAddCard(true));
}

function openAdd() {
  const modal = document.getElementById("modal");
  modal.hidden = false;
  modal.replaceChildren(buildAddCard(true));
  loadInfo();
}

function closeAdd() {
  document.getElementById("modal").hidden = true;
}

document.getElementById("add-camera").addEventListener("click", openAdd);
document.getElementById("modal").addEventListener("click", ev => {
  if (ev.target.id === "modal") closeAdd();
});

document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape" || ev.target instanceof HTMLInputElement) return;
  if (!document.getElementById("modal").hidden) closeAdd();
  else if (selected) closePanel();
});
document.title = CONFIG.title;
document.querySelector("header h1").textContent = CONFIG.title;
if (CONFIG.clapperUrl) document.getElementById("clapper").href = CONFIG.clapperUrl;
else document.getElementById("clapper").remove();
renderAddCards();
loadInfo();
setView(storageGet("tallycamView") || "cameras");
connect();
</script>
</body>
</html>
