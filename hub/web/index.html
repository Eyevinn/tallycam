      d.imageStats = m;
      if (d.shade) drawStats(d);
      updateWarnings(d);
      return;
    case "production":
      production = m;
      if (shadeBar) shadeBar.sent = null;
      // The cameras' mains notes compare with it.
      for (const dev of devices.values()) updateCard(dev);
      if (selected) updatePanel();
      updateShadeAll();
      return;
    case "error":
      if (d) {
        addLog(d.id, "error", "hub: " + m.message);
        shadeError(d, m.message);
      } else {
        console.warn("hub error:", m.message);
        if (shadeBar && /^production/.test(m.message || "")) { shadeBar.sent = null; updateProductionBar(); }
        shadeNotice(m.message);
      }
      return;
    default:
      return; // unknown types are ignored
  }
}

// ---------------------------------------------------------------------------
// Many cameras: search, filters, sort, density, tag sections, hiding on this
// screen, the custom order (drag and drop) and which previews this page
// watches. Cards and rows are built once and moved, never rebuilt; the
// layout (applyView) runs at most every 100 ms, and only when something it
// depends on changed (viewKey).
// ---------------------------------------------------------------------------

const FILTERS = [
  ["all", "All", () => true],
  ["online", "Online", d => d.online],
  ["live", "Live", d => isLiveState(d)],
  ["onair", "On air", d => d.tally === "program" || d.tally === "preview"],
  ["attention", "Needs attention", d => needsAttention(d)],
  ["offline", "Offline", d => !d.online],
];
const SORTS = ["custom", "name", "tally", "status", "seen"];
const DENSITIES = ["cards", "compact", "list"];
// Offline longer than this, a camera goes into the "Offline (n)" row.
const STALE_S = 24 * 3600;
const STALE_KEY = "\u0000stale";
const NO_TAG_KEY = "\u0000none";
const HIDDEN_KEY = "tallycamHidden:" + location.host + location.pathname;

// The view, kept in the URL fragment (#f=online&s=name&t=Studio%20A&d=list&g=1&q=cam).
const vs = { f: "all", s: "custom", t: "", d: "cards", g: false, q: "" };
// A camera to open from #<device id> (no "="), once it is listed.
let deepLink = null;
(() => {
  const h = INITIAL_HASH.slice(1);
  if (!h) return;
  if (!h.includes("=")) {
    try { deepLink = decodeURIComponent(h); } catch (e) { deepLink = h; }
    return;
  }
  const p = new URLSearchParams(h);
  if (FILTERS.some(([k]) => k === p.get("f"))) vs.f = p.get("f");
  if (SORTS.includes(p.get("s"))) vs.s = p.get("s");
  if (DENSITIES.includes(p.get("d"))) vs.d = p.get("d");
  vs.t = p.get("t") || "";
  vs.g = p.get("g") === "1";
  vs.q = p.get("q") || "";
})();

function writeHash() {
  const p = new URLSearchParams();
  if (vs.f !== "all") p.set("f", vs.f);
  if (vs.s !== "custom") p.set("s", vs.s);
  if (vs.t) p.set("t", vs.t);
  if (vs.d !== "cards") p.set("d", vs.d);
  if (vs.g) p.set("g", "1");
  if (vs.q) p.set("q", vs.q);
  const h = p.toString().replace(/\+/g, "%20");
  try { history.replaceState(null, "", location.pathname + location.search + (h ? "#" + h : "")); } catch (e) { /* sandboxed */ }
}

// Hidden on this screen: this browser, this page (host and path), never
// the hub. Not Forget.
const hiddenIds = new Set((() => {
  try { const v = JSON.parse(storageGet(HIDDEN_KEY) || "[]"); return Array.isArray(v) ? v.filter(x => typeof x === "string") : []; }
  catch (e) { return []; }
})());
let showHidden = false;

function setHidden(id, hide) {
  if (hide) hiddenIds.add(id); else hiddenIds.delete(id);
  storageSet(HIDDEN_KEY, JSON.stringify([...hiddenIds]));
  const d = devices.get(id);
  if (d) updateCard(d);
  scheduleView();
}

function nameOf(d) {
  return d.info.name || d.id;
}

function byName(a, b) {
  return nameOf(a).localeCompare(nameOf(b), undefined, { numeric: true, sensitivity: "base" });
}

// Online, and something the operator should look at: the clock not
// healthy, hot, an exposure warning, a stream error, a low battery that is
// not charging, or an app to update.
function needsAttention(d) {
  if (!d.online) return false;
  if (refusesShading(d)) return true;
  if (exposureWarning(d).text) return true;
  const s = d.status;
  if (!s) return false;
  const c = s.clock;
  if (c && (c.health || (c.synced ? "healthy" : "bad")) !== "healthy") return true;
  if (s.thermal === "serious" || s.thermal === "critical") return true;
  const st = s.stream;
  if (st && (st.state === "error" || st.error)) return true;
  const b = s.battery;
  if (b && typeof b.level === "number" && b.level < 0.2 && !b.charging) return true;
  return false;
}

function nowS() {
  return Math.floor(Date.now() / 1000);
}

// Offline and not seen for a day (or never, as far as the hub knows).
function isStale(d) {
  return !d.online && (typeof d.lastSeen !== "number" || nowS() - d.lastSeen > STALE_S);
}

function fmtSeen(d) {
  if (d.online) return "now";
  if (typeof d.lastSeen !== "number") return "never";
  const s = Math.max(0, nowS() - d.lastSeen);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return Math.floor(s / 86400) + " d ago";
}

function matchesSearch(d) {
  const q = vs.q.trim().toLowerCase();
  if (!q) return true;
  const i = d.info || {};
  return [i.name, i.model, d.id, i.platform, ...d.tags].some(x => x && String(x).toLowerCase().includes(q));
}

function hasTag(d, tag) {
  const t = tag.toLowerCase();
  return d.tags.some(x => x.toLowerCase() === t);
}

// What decides where a camera goes; a change lays the page out again.
function viewKey(d) {
  return [d.online, isLiveState(d), d.tally, needsAttention(d), nameOf(d), d.info.model || "",
    d.tags.join("\u0001"), isStale(d), d.lastSeen, hiddenIds.has(d.id)].join("|");
}

function noteViewKey(d) {
  const k = viewKey(d);
  if (k === d.vk) return;
  d.vk = k;
  scheduleView();
}

let viewTimer = null;
function scheduleView() {
  if (!viewTimer) viewTimer = setTimeout(applyView, 100);
}

function setOrder(ids) {
  const known = ids.filter(id => devices.has(id));
  const listed = new Set(known);
  const rest = order.filter(id => !listed.has(id));
  order.splice(0, order.length, ...known, ...rest);
}

function sortDevices(list) {
  const rank = {
    tally: d => d.tally === "program" ? 0 : d.tally === "preview" ? 1 : 2,
    status: d => isLiveState(d) ? 0 : d.online ? 1 : 2,
  };
  switch (vs.s) {
    case "name": return list.sort(byName);
    case "tally": case "status": return list.sort((a, b) => rank[vs.s](a) - rank[vs.s](b) || byName(a, b));
    case "seen": {
      const seen = d => d.online ? Infinity : typeof d.lastSeen === "number" ? d.lastSeen : -Infinity;
      return list.sort((a, b) => (seen(b) - seen(a)) || byName(a, b));
    }
    default: return list; // `order`, as the hub keeps it
  }
}

function reorderOn() {
  return vs.s === "custom" && !vs.g && vs.d !== "list";
}

const sections = new Map();  // key -> { root, head, body, grid, table, tbody }
let staleOpen = false;

function sectionEl(key) {
  let s = sections.get(key);
  if (s) return s;
  const collapsible = key === STALE_KEY;
  const head = collapsible
    ? el("button", { type: "button", class: "sec-head", onclick: () => { staleOpen = !staleOpen; applyView(); } })
    : el("div", { class: "sec-head" });
  const body = el("div", {});
  s = { root: el("div", { class: "sec" }, head, body), head, body, grid: null, table: null, tbody: null };
  sections.set(key, s);
  return s;
}

function sectionBody(s, list) {
  if (!list) {
    if (!s.grid) s.grid = el("div", { class: "cgrid" });
    s.grid.classList.toggle("compact", vs.d === "compact");
    return s.grid;
  }
  if (!s.table) {
    s.tbody = el("tbody", {});
    s.table = el("div", { class: "lwrap" }, el("table", { class: "dlist" },
      el("thead", {}, el("tr", {}, ["", "Name", "Tally", "Stream", "Battery", "Thermal", "Clock", "Last seen", ""]
        .map(h => el("th", {}, h)))),
      s.tbody));
  }
  return s.table;
}

// Put `nodes` in `parent` in this order, moving only what is out of place.
function placeChildren(parent, nodes) {
  let i = 0;
  for (const n of nodes) {
    const at = parent.children[i];
    if (at !== n) parent.insertBefore(n, at || null);
    i++;
  }
  while (parent.children.length > nodes.length) parent.lastElementChild.remove();
}

function applyView() {
  clearTimeout(viewTimer);
  viewTimer = null;
  const all = order.map(id => devices.get(id)).filter(Boolean);
  document.getElementById("empty").style.display = all.length ? "none" : "";
  const base = all.filter(d => (showHidden || !hiddenIds.has(d.id)) && matchesSearch(d) && (!vs.t || hasTag(d, vs.t)));
  const filter = (FILTERS.find(([k]) => k === vs.f) || FILTERS[0])[2];
  const shown = sortDevices(base.filter(filter));
  updateTools(all, base, shown);

  // Sections: every camera (or one per tag), then old offline ones.
  const fresh = shown.filter(d => !isStale(d));
  const stale = shown.filter(isStale);
  const secs = [];
  if (vs.g) {
    const names = new Map();  // lower case -> first spelling
    for (const d of fresh) for (const t of d.tags) if (!names.has(t.toLowerCase())) names.set(t.toLowerCase(), t);
    const tags = [...names.values()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true }));
    for (const t of tags) secs.push({ key: "t:" + t.toLowerCase(), title: t, devs: fresh.filter(d => hasTag(d, t)) });
    const untagged = fresh.filter(d => !d.tags.length);
    if (untagged.length) secs.push({ key: NO_TAG_KEY, title: "No tag", devs: untagged });
  } else {
    secs.push({ key: "", title: "", devs: fresh });
  }
  if (stale.length) secs.push({ key: STALE_KEY, title: "", devs: stale, collapsed: !staleOpen });

  const list = vs.d === "list";
  const used = new Map();  // device id -> card or row keys used
  const roots = [];
  for (const sec of secs) {
    const s = sectionEl(sec.key);
    roots.push(s.root);
    if (sec.key === STALE_KEY) {
      s.head.textContent = (staleOpen ? "▾ " : "▸ ") + "Offline (" + sec.devs.length + ")";
      s.head.title = "Cameras offline for more than a day" + (staleOpen ? "" : ": click to show them");
    } else {
      s.head.textContent = sec.title ? sec.title + " · " + sec.devs.length : "";
    }
    if (sec.collapsed) { s.body.replaceChildren(); continue; }
    const body = sectionBody(s, list);
    placeChildren(s.body, [body]);
    const items = sec.devs.map(d => {
      // A camera's first place uses its "" card; more places (tags) their own.
      const keys = used.get(d.id) || [];
      const key = keys.length ? sec.key : "";
      keys.push(key);
      used.set(d.id, keys);
      return list ? rowFor(d, key) : cardFor(d, key);
    });
    if (list) {
      placeChildren(s.tbody, items.map(r => r.root));
    } else {
      s.grid.classList.toggle("reorder", reorderOn());
      placeChildren(s.grid, items.map(c => c.root));
      if (!items.length) s.grid.replaceChildren(el("div", { class: "none" }, all.length ? "No camera matches." : ""));
    }
    for (const it of items) if (it.dirty) (list ? updateRow : updateCardEl)(devices.get(it.root.dataset.id), it);
  }
  placeChildren(document.getElementById("sections"), roots);

  // Extra cards and rows of sections that are gone.
  for (const d of all) {
    const keep = new Set(used.get(d.id) || []);
    for (const [k, c] of d.cards) if (k !== "" && !(keep.has(k) && !list)) {
      c.root.remove();
      if (cardObserver) cardObserver.unobserve(c.root);
      visibleCards.delete(c.root);
      d.cards.delete(k);
    }
    for (const [k, r] of d.rows) if (k !== "" && !(keep.has(k) && list)) { r.root.remove(); d.rows.delete(k); }
  }
  scheduleWatch();
}

// The toolbar: chip counts, the tag list, the header count.
function updateTools(all, base, shown) {
  for (const b of document.querySelectorAll("#filters button")) {
    const f = FILTERS.find(([k]) => k === b.dataset.f);
    b.classList.toggle("active", vs.f === f[0]);
    b.querySelector(".n").textContent = base.filter(f[2]).length;
  }
  const tagNames = new Map();
  for (const d of all) for (const t of d.tags) if (!tagNames.has(t.toLowerCase())) tagNames.set(t.toLowerCase(), t);
  if (vs.t && !tagNames.has(vs.t.toLowerCase())) tagNames.set(vs.t.toLowerCase(), vs.t);
  const tags = [...tagNames.values()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true }));
  const sel = document.getElementById("tag-filter");
  const key = tags.join("\u0001");
  if (sel._key !== key) {
    sel._key = key;
    sel.replaceChildren(el("option", { value: "" }, "All tags"), ...tags.map(t => el("option", { value: t }, t)));
    document.getElementById("tag-options").replaceChildren(...tags.map(t => el("option", { value: t })));
  }
  sel.value = tags.find(t => t.toLowerCase() === vs.t.toLowerCase()) || "";
  sel.style.display = tags.length ? "" : "none";
  document.getElementById("sort").value = vs.s;
  for (const b of document.querySelectorAll("#density button")) b.classList.toggle("active", b.dataset.d === vs.d);
  const group = document.getElementById("group");
  group.classList.toggle("on", vs.g);
  group.setAttribute("aria-pressed", vs.g ? "true" : "false");
  const search = document.getElementById("search");
  if (document.activeElement !== search && search.value !== vs.q) search.value = vs.q;
  const hiddenNow = all.filter(d => hiddenIds.has(d.id)).length;
  const chip = document.getElementById("hidden-chip");
  chip.hidden = !hiddenNow;
  chip.textContent = "Hidden (" + hiddenNow + ")";
  chip.classList.toggle("on", showHidden);
  const online = all.filter(d => d.online).length;
  document.getElementById("count").textContent = !all.length ? ""
    : shown.length < all.length ? `${shown.length} of ${all.length} cameras`
    : `${online} online / ${all.length} cameras`;
}

function setVs(change) {
  Object.assign(vs, change);
  writeHash();
  applyView();
}

function initTools() {
  const filters = document.getElementById("filters");
  filters.replaceChildren(...FILTERS.map(([k, label]) => el("button", {
    type: "button", "data-f": k, onclick: () => setVs({ f: k }),
  }, label, el("span", { class: "n" }))));
  const search = document.getElementById("search");
  search.value = vs.q;
  let t = null;
  search.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => setVs({ q: search.value }), 120);
  });
  search.addEventListener("keydown", ev => {
    if (ev.key === "Escape") { search.value = ""; setVs({ q: "" }); search.blur(); }
  });
  document.getElementById("tag-filter").addEventListener("change", ev => setVs({ t: ev.target.value }));
  document.getElementById("sort").addEventListener("change", ev => setVs({ s: ev.target.value }));
  for (const b of document.querySelectorAll("#density button")) b.addEventListener("click", () => setVs({ d: b.dataset.d }));
  document.getElementById("group").addEventListener("click", () => setVs({ g: !vs.g }));
  document.getElementById("hidden-chip").addEventListener("click", () => { showHidden = !showHidden; applyView(); });
  if ("IntersectionObserver" in window) {
    cardObserver = new IntersectionObserver(entries => {
      for (const e of entries) {
        if (e.isIntersecting) visibleCards.add(e.target); else visibleCards.delete(e.target);
      }
      scheduleWatch();
    }, { root: document.getElementById("grid"), rootMargin: "200px 0px" });
  }
  // Last seen moves on, and a camera offline for a day joins the old ones.
  setInterval(() => {
    for (const d of devices.values()) {
      noteViewKey(d);
      if (!d.online) forRows(d, r => { r.seen.textContent = fmtSeen(d); });
    }
  }, 30000);
  applyView();
}

// The operator's tags as chips; `removable` adds an x that sends the tags
// without it.
function setUserTags(holder, d, removable) {
  const key = d.tags.join("\u0001");
  if (holder._key === key) return;
  holder._key = key;
  holder.replaceChildren(...d.tags.map(t => el("span", { class: "utag", title: t }, t,
    removable ? el("button", {
      class: "x", type: "button", title: "Remove " + t, "aria-label": "Remove tag " + t,
      onclick: ev => { ev.stopPropagation(); send({ type: "tags", device: d.id, tags: d.tags.filter(x => x !== t) }); },
    }, "×") : null)));
}

// ---------------------------------------------------------------------------
// List density: one row per camera, no preview.
// ---------------------------------------------------------------------------

function rowFor(d, key) {
  let r = d.rows.get(key);
  if (r) return r;
  const cell = cls => el("td", cls ? { class: cls } : {});
  const dot = el("span", { class: "dot" });
  const name = el("span", { class: "name" });
  const notes = el("span", { class: "tags" });
  const utags = el("span", { class: "utags" });
  const hide = el("button", {
    class: "mini", type: "button",
    onclick: ev => { ev.stopPropagation(); setHidden(d.id, !hiddenIds.has(d.id)); },
  });
  const td = { tally: cell(), stream: cell(), battery: cell(), thermal: cell(), clock: cell(), seen: cell("muted") };
  const nm = el("td", { class: "nm" }, name, notes, " ", utags);
  const root = el("tr", { class: "dev", onclick: () => select(d.id) },
    el("td", {}, dot), nm, td.tally, td.stream, td.battery, td.thermal, td.clock, td.seen, el("td", {}, hide));
  root.dataset.id = d.id;
  r = { root, dot, name, notes, utags, hide, ...td, dirty: true };
  d.rows.set(key, r);
  return r;
}

function forRows(d, fn) {
  for (const r of d.rows.values()) {
    if (r.root.isConnected) fn(r);
    else r.dirty = true;
  }
}

function updateRow(d, r) {
  r.dirty = false;
  r.root.classList.toggle("selected", selected === d.id);
  r.root.classList.toggle("is-hidden", hiddenIds.has(d.id));
  r.dot.className = "dot" + (d.online ? " on" : "");
  setName(r.name, d);
  setTags(r.notes, d);
  setUserTags(r.utags, d);
  r.hide.textContent = hiddenIds.has(d.id) ? "Show" : "Hide";
  r.hide.title = hiddenIds.has(d.id) ? "Show on this screen again" : "Hide on this screen (this browser only; not Forget)";
  r.tally.replaceChildren(d.tally === "program" ? el("span", { class: "name t-program" }, "PGM")
    : d.tally === "preview" ? el("span", { class: "name t-preview" }, "PVW") : "");
  const s = d.online ? d.status : null;
  const st = s && s.stream;
  r.stream.replaceChildren();
  if (st && st.state && st.state !== "idle") {
    r.stream.append(el("span", { class: "badge " + known(STREAM_STATES, st.state, "other"), title: st.error || "" },
      String(st.state).toUpperCase()));
    if (st.state === "live" && typeof st.bitrate_kbps === "number") r.stream.append(" " + (st.bitrate_kbps / 1000).toFixed(1) + " Mb/s");
  } else if (d.online) {
    r.stream.append(el("span", { class: "muted" }, st ? "idle" : "-"));
  }
  const b = s && s.battery;
  if (b && typeof b.level === "number") {
    const pct = Math.round(b.level * 100);
    r.battery.replaceChildren(el("span", { class: pct < 20 && !b.charging ? "chip low" : "" }, pct + "%" + (b.charging ? " chg" : "")));
  } else {
    r.battery.replaceChildren();
  }
  r.thermal.replaceChildren(s && s.thermal ? el("span", { class: "chip " + known(THERMAL_STATES, s.thermal, "other") }, s.thermal) : "");
  const c = s && s.clock;
  if (c) {
    const level = c.health || (c.synced ? "healthy" : "bad");
    r.clock.replaceChildren(el("span", { class: "chip clk-" + known(CLOCK_HEALTH, level, "other"), title: clockSummaryText(c) }, level));
  } else {
    r.clock.replaceChildren();
  }
  r.seen.textContent = fmtSeen(d);
}

// ---------------------------------------------------------------------------
// Custom order: drag a card by its handle (mouse: HTML5 drag and drop;
// touch and pen: pointer events) and drop it before or after another. The
// page sends the full order (`arrange`), every camera included, with the
// moved one next to its new visible neighbour.
// ---------------------------------------------------------------------------

let dragId = null;
let dropAt = null;  // { card, before }

function clearDrop() {
  if (dropAt) dropAt.card.classList.remove("drop-before", "drop-after");
  dropAt = null;
}

function markDrop(card, clientX) {
  const r = card.getBoundingClientRect();
  const before = clientX < r.left + r.width / 2;
  if (dropAt && dropAt.card === card && dropAt.before === before) return;
  clearDrop();
  if (card.dataset.id === dragId) return;
  dropAt = { card, before };
  card.classList.add(before ? "drop-before" : "drop-after");
}

function finishDrop() {
  const at = dropAt;
  clearDrop();
  const moved = dragId;
  dragId = null;
  for (const c of document.querySelectorAll(".card.dragging")) c.classList.remove("dragging");
  if (!at || !moved || !reorderOn()) return;
  const target = at.card.dataset.id;
  if (target === moved) return;
  const next = order.filter(id => id !== moved);
  let i = next.indexOf(target);
  if (i < 0) return;
  if (!at.before) i++;
  next.splice(i, 0, moved);
  order.splice(0, order.length, ...next);
  send({ type: "arrange", order: next });
  applyView();
}

function dragSource(d, c, handle) {
  handle.setAttribute("draggable", "true");
  handle.addEventListener("click", ev => ev.stopPropagation());
  handle.addEventListener("dragstart", ev => {
    // Not while a touch drag (below) runs.
    if (!reorderOn() || dragId) { ev.preventDefault(); return; }
    dragId = d.id;
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", d.id);
    try { ev.dataTransfer.setDragImage(c.root, 24, 16); } catch (e) { /* older browsers */ }
    c.root.classList.add("dragging");
  });
  handle.addEventListener("dragend", () => { clearDrop(); dragId = null; c.root.classList.remove("dragging"); });
  // Touch and pen: follow the pointer, scroll near the edges.
  handle.addEventListener("pointerdown", ev => {
    if (ev.pointerType === "mouse" || !reorderOn()) return;
    ev.preventDefault();
    ev.stopPropagation();
    dragId = d.id;
    c.root.classList.add("dragging");
    try { handle.setPointerCapture(ev.pointerId); } catch (e) { /* gone */ }
    const grid = document.getElementById("grid");
    const move = e => {
      const g = grid.getBoundingClientRect();
      if (e.clientY < g.top + 40) grid.scrollBy(0, -12);
      else if (e.clientY > g.bottom - 40) grid.scrollBy(0, 12);
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const card = under && under.closest(".cgrid.reorder .card");
      if (card) markDrop(card, e.clientX); else clearDrop();
    };
    const end = e => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", end);
      handle.removeEventListener("pointercancel", end);
      if (e.type === "pointercancel") clearDrop();
      finishDrop();
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  });
}

function dropTarget(d, card) {
  card.addEventListener("dragover", ev => {
    if (!dragId || !reorderOn() || !card.closest(".cgrid.reorder")) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
    markDrop(card, ev.clientX);
  });
  card.addEventListener("dragleave", ev => {
    if (dropAt && dropAt.card === card && !card.contains(ev.relatedTarget)) clearDrop();
  });
  card.addEventListener("drop", ev => {
    if (!dragId) return;
    ev.preventDefault();
    markDrop(card, ev.clientX);
    finishDrop();
  });
}

// ---------------------------------------------------------------------------
// Watch: the hub sends previews only for the cameras some controller shows.
// This page shows the cards in (or near) the viewport and the open panel;
// in list view and in collapsed or hidden sections only the panel; the
// Shading view shows every camera (null: all).
// ---------------------------------------------------------------------------

let cardObserver = null;
const visibleCards = new Set();
let watchTimer = null;
let watchSent;  // the last `devices` sent, as JSON; undefined after a (re)connect

function watchedIds() {
  if (view === "shading" || !cardObserver) return null;
  const ids = new Set();
  if (vs.d !== "list") for (const root of visibleCards) if (root.isConnected) ids.add(root.dataset.id);
  if (selected && panel) ids.add(selected);
  return [...ids].sort();
}

function scheduleWatch() {
  clearTimeout(watchTimer);
  watchTimer = setTimeout(sendWatch, 300);
}

function sendWatch() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const ids = watchedIds();
  const key = JSON.stringify(ids);
  if (key === watchSent) return;
  watchSent = key;
  send({ type: "watch", devices: ids });
}

// ---------------------------------------------------------------------------
// Shading view (docs/SHADING.md): every camera side by side with its picture,
// a waveform or histogram from image_stats, and its exposure and colour
// controls. The camera operator can change the same controls on the phone at
// any time: the last write wins.
// ---------------------------------------------------------------------------

let view = "cameras";
let scopeMode = "waveform";  // or "histogram"
let production = null;       // { mains_hz, shutter } from the hub
let shadeBar = null;         // { mains, shutter, note, scope, notice, noticeUntil }

function storageGet(k) {
  try { return localStorage.getItem(k); } catch (e) { return null; }
}

function storageSet(k, v) {
  try { localStorage.setItem(k, v); } catch (e) { /* private mode */ }
}

function hasShading(d) {
  return (d.protocol || 0) >= SHADE_PROTOCOL;
}

// The shutter is free (set per camera in manual exposure, shortened by auto
// ISO only at the lowest ISO) under a free policy, and under mains with no
// mains-lit light: nothing to flicker against. Production::shutter_free in
// the core is the same rule.
function shutterFree(p) {
  return !!p && (p.shutter === "free" || (p.shutter === "mains" && Number(p.mains_hz) === 0));
}

function isLiveState(d) {
  const st = d.status && d.status.stream;
  return !!(d.online && st && (st.state === "live" || st.state === "connecting"));
}

function anyLive() {
  for (const d of devices.values()) if (isLiveState(d)) return true;
  return false;
}

// Colour values of one camera, to set on others (wb_mode manual, so the
// temperature and tint take effect).
function colourOf(d) {
  const v = { wb_mode: "manual" };
  if (typeof d.state.wb_temperature === "number") v.wb_temperature = d.state.wb_temperature;
  if (typeof d.state.wb_tint === "number") v.wb_tint = d.state.wb_tint;
  return v;
}

function hasColour(d) {
  return !!controlById(d, "wb_temperature");
}

// Set `src`'s colour on `targets`.
function copyColour(src, targets) {
  const values = colourOf(src);
  if (!("wb_temperature" in values)) { shadeError(src, "no white balance temperature to copy"); return; }
  targets = targets.filter(t => t.id !== src.id && takesColour(t));
  if (!targets.length) { shadeError(src, "No other camera can take a colour now (offline, or an app to update)"); return; }
  for (const t of targets) sendSet(t.id, values, true);
}

function b64bytes(s) {
  try {
    const bin = atob(s || "");
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  } catch (e) {
    return new Uint8Array(0);
  }
}

// Waveform (32 columns of 16 levels) or histogram (32 bins) of image_stats.
function drawScope(canvas, stats) {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const W = Math.max(64, Math.round((r.width || 280) * dpr)), H = Math.max(32, Math.round((r.height || 96) * dpr));
  if (canvas.width !== W) canvas.width = W;
  if (canvas.height !== H) canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#07090b";
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#1f252d";
  ctx.lineWidth = 1;
  for (const q of [0.25, 0.5, 0.75]) {
    const y = Math.round(H - q * H) + 0.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  const luma = stats && stats.luma;
  if (!luma) return;
  canvas.title = scopeMode === "histogram"
    ? "Histogram: how much of the picture has each brightness, black left to white right. Click for waveform"
    : "Waveform: brightness (black at the bottom, white at the top) for each strip of the picture, left to right. Red: clipped. Click for histogram";
  canvas.style.cursor = "pointer";
  if (scopeMode === "histogram") {
    const h = b64bytes(luma.histogram);
    if (!h.length) return;
    const bw = W / h.length;
    h.forEach((v, i) => {
      const bh = v / 255 * (H - 2);
      ctx.fillStyle = i === h.length - 1 && v > 0 ? "#e5302f" : i === 0 && v > 0 ? "#4c9aff" : "#9aa4b2";
      ctx.fillRect(i * bw + 0.5, H - bh, Math.max(1, bw - 1), bh);
    });
  } else {
    const cols = 32, levels = 16;
    const w = b64bytes(luma.waveform);
    if (w.length < cols * levels) return;
    const cw = W / cols, lh = H / levels;
    for (let c = 0; c < cols; c++) {
      for (let l = 0; l < levels; l++) {
        const a = w[c * levels + l] / 255;
        if (a <= 0) continue;
        ctx.fillStyle = l === levels - 1 ? `rgba(240,90,80,${Math.min(1, 0.25 + a * 2.5)})`
                                         : `rgba(90,230,130,${Math.min(1, 0.2 + a * 2.5)})`;
        ctx.fillRect(c * cw, H - (l + 1) * lh, cw - 0.5, lh - 0.5);
      }
    }
  }
}

function pct(x) {
  return typeof x === "number" ? (x * 100).toFixed(x < 0.1 ? 1 : 0) + "%" : "-";
}

function drawStats(d) {
  const sh = d.shade;
  if (!sh) return;
  drawScope(sh.canvas, d.imageStats);
  const l = d.imageStats && d.imageStats.luma;
  if (!l) {
    sh.meter.replaceChildren(el("span", {}, hasShading(d) ? "no image statistics yet" : "no image statistics (older app)"));
    return;
  }
  sh.meter.replaceChildren(
    el("span", { class: l.clipped > 0.02 ? "hot" : "", title: "Share of the picture at the top of the range" }, "clip ", el("b", {}, pct(l.clipped))),
    el("span", { class: l.crushed > 0.05 ? "hot" : "", title: "Share of the picture at the bottom of the range" }, "crush ", el("b", {}, pct(l.crushed))),
    el("span", { title: "Mean and median level" }, "mean ", el("b", {}, pct(l.mean)), " p50 ", el("b", {}, pct(l.p50))));
}

// A slider for a range control (log when the descriptor says so), throttled
// like the panel's: about 10 sets a second while dragging, one with an id on
// release so a refusal shows up. While the user drags (and for a moment
// after, until the phone answers) the slider is not moved by state events;
// then it follows them again. A double click goes to `neutral`, if given.
function shadeSlider(label, desc, fmt, sendValue, neutral) {
  const min = Number(desc.min ?? 0), max = Number(desc.max ?? 100);
  const step = desc.step ? Number(desc.step) : 0;
  const isLog = desc.scale === "log" && min > 0 && max > min;
  const POS = 1000;
  const toPos = v => isLog ? Math.round(Math.log(Math.max(v, min) / min) / Math.log(max / min) * POS) : v;
  const fromPos = p => {
    let v = isLog ? min * Math.pow(max / min, p / POS) : Number(p);
    if (step > 0) v = min + Math.round((v - min) / step) * step;
    v = Math.min(max, Math.max(min, v));
    return Number(v.toFixed(step > 0 ? decimalsFor(step) : 3));
  };
  const slider = el("input", { type: "range", "aria-label": label });
  if (isLog) { slider.min = 0; slider.max = POS; slider.step = 1; }
  else { slider.min = min; slider.max = max; slider.step = step > 0 ? step : "any"; }
  const val = el("span", { class: "sval" });
  const why = el("span", { class: "why" });
  const row = el("div", { class: "srow" }, el("label", {}, label), el("div", { class: "cell" }, slider, why), val);
  let dragging = false, lastSent = 0, timer = null, queued = null, settle = null, last = null;
  const flush = withId => {
    clearTimeout(timer); timer = null;
    if (queued === null) return;
    lastSent = performance.now();
    sendValue(queued, withId);
    queued = null;
  };
  slider.addEventListener("input", () => {
    dragging = true;
    clearTimeout(settle);
    queued = fromPos(slider.value);
    val.textContent = fmt(queued);
    const wait = 100 - (performance.now() - lastSent);
    if (wait <= 0) flush(false);
    else if (!timer) timer = setTimeout(() => flush(false), wait);
  });
  slider.addEventListener("change", () => {
    queued = fromPos(slider.value);
    flush(true);
    clearTimeout(settle);
    // Then show what the phone did (it may clamp or snap).
    settle = setTimeout(() => { dragging = false; if (last) api.update(...last); }, 600);
  });
  if (neutral !== undefined) {
    slider.addEventListener("dblclick", () => {
      if (slider.disabled) return;
      sendValue(neutral, true);
    });
  }
  const api = {
    row,
    dragging: () => dragging,
    update(value, reason, held) {
      last = [value, reason, held];
      slider.disabled = !!reason;
      row.classList.toggle("disabled", !!reason);
      row.title = reason ? reason.long : neutral !== undefined ? "Double click: " + fmt(neutral) : "";
      why.textContent = reason && !reason.wide ? reason.short : "";
      val.classList.toggle("held", !!held);
      if (dragging) return;
      if (typeof value === "number") {
        slider.value = toPos(value);
        val.textContent = fmt(value);
      } else {
        val.textContent = "";
      }
    },
  };
  return api;
}

// The mode of a group as the phones show it: A (auto) or M (manual, at the
// camera's current values). An older phone may offer only "locked" for a
// group; M sends that there.
function shadeModes(d, c, label, first) {
  const opts = (c.options || []).map(o => o.value);
  const hold = opts.includes("manual") ? "manual" : opts.includes("locked") ? "locked" : null;
  const group = MODE_GROUP[c.id] || "this group";
  const a = el("button", {
    type: "button", title: "Auto " + group,
    onclick: () => { if (!isAuto(d.state[c.id])) sendSet(d.id, { [c.id]: "auto" }, true); },
  }, "A");
  const m = el("button", {
    type: "button", title: "Manual " + group + " (M: holds the current values)",
    onclick: () => { if (isAuto(d.state[c.id]) && hold) sendSet(d.id, { [c.id]: hold }, true); },
  }, "M");
  const why = el("span", { class: "why" });
  const word = el("span", { class: "sval mode" });
  const row = el("div", { class: "srow" + (first ? " first" : "") },
    el("label", { title: c.label || c.id }, label), el("div", { class: "cell" }, el("div", { class: "seg" }, a, m), why), word);
  return {
    row,
    update() {
      const reason = disabledReason(d, c);
      const v = d.state[c.id];
      const held = v !== undefined && !isAuto(v);
      row.classList.toggle("disabled", !!reason);
      row.title = reason ? reason.long : "";
      why.textContent = reason && !reason.wide ? reason.short : "";
      a.disabled = !!reason || !opts.includes("auto");
      m.disabled = !!reason || !hold;
      a.classList.toggle("active", v !== undefined && !held);
      m.classList.toggle("active", held);
      m.classList.toggle("held", held);
      word.textContent = v === undefined ? "" : isAuto(v) ? "Auto" : "Manual";
    },
  };
}

function fmtShutter(v) {
  return typeof v === "number" ? "1/" + v : "";
}

function fmtProductionShutter(p) {
  if (!p) return "";
  if (typeof p.shutter === "number") return "1/" + p.shutter;
  if (shutterFree(p)) return "free";
  return "1/" + (Number(p.mains_hz) === 60 ? 60 : 50) + " (mains)";
}

function buildShadeCard(d) {
  const img = el("img", { alt: "" });
  img.style.display = "none";
  const overlay = el("div", { class: "overlay" });
  const badge = el("span", { class: "badge" });
  badge.style.display = "none";
  // Click to switch every camera between waveform and histogram (the
  // same switch as "Scope" in the bar above).
  const canvas = el("canvas", {
    class: "scope",
    onclick: () => {
      scopeMode = scopeMode === "waveform" ? "histogram" : "waveform";
      storageSet("tallycamScope", scopeMode);
      updateShadeAll();
    },
  });
  const meter = el("div", { class: "meter" });
  const xwarn = el("span", { class: "xwarn" });
  const readout = el("div", { class: "readout" });
  const err = el("div", { class: "shade-err" });
  const note = el("div", { class: "group-note" });
  const ctl = el("div", { class: "shade-ctl" }, note);
  const updaters = [];
  const sliders = [];
  // Slider rows: a set from the hub switches the group to manual with it
  // (`hold`), as the phone's rocker does for colour and focus.
  const addSlider = (cid, label, fmt, hold, held, neutral) => {
    const desc = controlById(d, cid);
    if (!desc) return;
    const s = shadeSlider(label, desc, fmt, (v, withId) => {
      const values = { [cid]: v };
      if (hold) for (const [k, mv] of Object.entries(hold)) if (d.state[k] !== mv) values[k] = mv;
      sendSet(d.id, values, withId);
    }, neutral);
    ctl.append(s.row);
    sliders.push(s);
    updaters.push(() => s.update(d.state[cid], disabledReason(d, desc, hold), held()));
  };
  const modeRow = (cid, label, first) => {
    const c = controlById(d, cid);
    if (!c) return;
    const m = shadeModes(d, c, label, first);
    ctl.append(m.row);
    updaters.push(m.update);
  };

  // Exposure: mode, ISO (the "iris"), compensation in auto, and the
  // shutter: a production setting, set per camera (in manual) only when
  // the camera says it is free.
  const expHeld = () => !isAuto(d.state.exposure_mode);
  modeRow("exposure_mode", "Exposure", false);
  addSlider("iso", "ISO", v => String(Math.round(v)), { exposure_mode: "manual" }, expHeld);
  addSlider("ev_bias", "EV", v => fmtEv(v).replace(" EV", ""), null, () => false, 0);
  const shutterDesc = controlById(d, "shutter");
  if (shutterDesc || "shutter" in d.state) {
    const text = el("span", { class: "sval" });
    const fixed = el("span", { class: "fixed" });
    const why = el("span", { class: "why" });
    const sel = el("select", { "aria-label": "Shutter" });
    for (const o of (shutterDesc && shutterDesc.options) || [])
      sel.append(el("option", { value: JSON.stringify(o.value) }, String(o.label ?? o.value)));
    sel.addEventListener("change", () => {
      const values = { shutter: JSON.parse(sel.value) };
      if (d.state.exposure_mode !== "manual") values.exposure_mode = "manual";
      sendSet(d.id, values, true);
      sel.blur();
    });
    const row = el("div", { class: "srow" }, el("label", {}, "Shutter"), el("div", { class: "cell" }, sel, fixed, why), text);
    ctl.append(row);
    updaters.push(() => {
      const reason = disabledReason(d, shutterDesc, { exposure_mode: "manual" });
      const production_ = !shutterDesc || !shutterDesc.options || (reason && reason.short === "Production");
      const prod = production ? "Production shutter " + fmtProductionShutter(production) +
        ", mains " + (Number(production.mains_hz) === 0 ? "off" : production.mains_hz + " Hz") : "";
      // A production shutter is shown, not offered: there is nothing to pick.
      sel.style.display = production_ ? "none" : "";
      fixed.style.display = production_ ? "" : "none";
      fixed.textContent = production_ ? "Production" + (production ? " · " + fmtProductionShutter(production) : "") : "";
      sel.disabled = !!reason;
      why.textContent = reason && !reason.wide && !production_ ? reason.short : "";
      row.classList.toggle("disabled", !!reason && !production_);
      row.title = [reason ? reason.long : "", prod].filter(Boolean).join("\n");
      if (!production_ && document.activeElement !== sel) {
        const i = shutterDesc.options.findIndex(o => same(o.value, d.state.shutter));
        sel.selectedIndex = i;
      }
      text.textContent = fmtShutter(d.state.shutter);
      text.classList.toggle("held", expHeld());
    });
  }

  // Colour: mode, temperature and tint.
  const wbHeld = () => !isAuto(d.state.wb_mode);
  modeRow("wb_mode", "Colour", true);
  addSlider("wb_temperature", "Temp", v => Math.round(v) + " K", { wb_mode: "manual" }, wbHeld);
  addSlider("wb_tint", "Tint", fmtTint, { wb_mode: "manual" }, wbHeld, 0);

  // Focus: mode and position (0 near, 1 far).
  const focusHeld = () => d.state.focus_mode !== undefined && !isAuto(d.state.focus_mode);
  modeRow("focus_mode", "Focus", true);
  addSlider("focus_position", "Position", v => v.toFixed(2), { focus_mode: "manual" }, focusHeld);

  // Copy and match colour, white balance once.
  const copyAll = el("button", {
    class: "btn", type: "button",
    title: "Set this camera's white balance (temperature and tint) on every other camera",
    onclick: () => copyColour(d, order.map(id => devices.get(id)).filter(Boolean)),
  }, "Copy colour to all");
  const match = el("select", {
    "aria-label": "Match colour",
    title: "Give this camera another camera's white balance (temperature and tint)",
    onchange: () => {
      const t = devices.get(match.value);
      match.value = "";
      match.blur();
      if (t) copyColour(t, [d]);
    },
  });
  const hasOnce = d.commands.some(c => c.name === "wb_one_shot");
  const once = hasOnce ? el("button", {
    class: "btn", type: "button",
    title: "Measure the white balance once, then hold it",
    onclick: () => sendCommand(d.id, "wb_one_shot"),
  }, "WB once") : null;
  const actions = el("div", { class: "shade-actions" }, copyAll, match, once);
  if (!hasColour(d)) actions.style.display = "none";

  const name = el("span", { class: "name" });
  const tags = el("span", { class: "tags" });
  const root = el("div", { class: "shade-card" },
    el("div", { class: "card-head" }, el("span", { class: "dot" }), name, tags, el("span", { class: "model" })),
    el("div", { class: "media" }, img, overlay, badge, xwarn),
    readout, canvas, meter, ctl, actions, err);
  d.shade = {
    root, img, overlay, badge, xwarn, readout, canvas, meter, err, updaters, match, copyAll, once, name, tags, note,
    errTimer: null, layout: shadeLayout(d), rebuild: false,
    dragging: () => sliders.some(s => s.dragging()),
  };
  return root;
}

// What a shading card is built from: the descriptors it shows, the
// commands and the protocol. A hello that changes none of it updates the
// card in place.
const SHADE_CONTROLS = ["exposure_mode", "iso", "ev_bias", "shutter", "wb_mode", "wb_temperature", "wb_tint",
  "focus_mode", "focus_position"];
function shadeLayout(d) {
  return JSON.stringify([d.protocol || 0, SHADE_CONTROLS.map(id => controlById(d, id) || null),
    d.commands.some(c => c.name === "wb_one_shot")]);
}

// Build a card again in its place, keeping a shown error.
function rebuildShadeCard(d) {
  const old = d.shade;
  const root = buildShadeCard(d);
  if (old) {
    old.root.replaceWith(root);
    clearTimeout(old.errTimer);
    if (old.err.textContent) shadeError(d, old.err.textContent);
  }
  return root;
}

// The exposure warnings, from a new log line or statistics.
function updateWarnings(d) {
  forCards(d, c => { showWarning(c.xwarn, d); updateReadout(d, c.readout); });
  noteViewKey(d);
  if (d.shade) { showWarning(d.shade.xwarn, d); updateReadout(d, d.shade.readout); }
}

// Can `t` take a colour from this page now?
function takesColour(t) {
  return hasColour(t) && isEnabled(t, controlById(t, "wb_temperature"), { wb_mode: "manual" });
}

function updateShadeCard(d) {
  let sh = d.shade;
  if (!sh || view !== "shading") return;
  if (sh.rebuild && !sh.dragging()) {
    rebuildShadeCard(d);
    sh = d.shade;
  }
  const r = sh.root;
  r.classList.toggle("offline", !d.online);
  r.classList.toggle("tally-preview", d.tally === "preview");
  r.classList.toggle("tally-program", d.tally === "program");
  r.querySelector(".card-head .dot").className = "dot" + (d.online ? " on" : "");
  setName(sh.name, d);
  setTags(sh.tags, d);
  r.querySelector(".card-head .model").textContent = d.info.model || "";
  updateMedia(d, sh.img, sh.overlay);
  const st = d.status && d.status.stream;
  if (d.online && st && st.state && st.state !== "idle") {
    sh.badge.style.display = "";
    sh.badge.className = "badge " + known(STREAM_STATES, st.state, "other");
    sh.badge.textContent = String(st.state).toUpperCase();
    // Why it failed or is reconnecting, as on the Cameras view.
    sh.badge.title = st.error || "";
  } else {
    sh.badge.style.display = "none";
  }
  updateReadout(d, sh.readout);
  showWarning(sh.xwarn, d);
  // A camera-wide reason, once above the controls.
  sh.note.textContent = d.online && refusesShading(d) ? "Update app: this version refuses exposure, colour and focus from the hub." : "";
  sh.note.title = sh.note.textContent ? OUTDATED_APP : "";
  for (const u of sh.updaters) u();
  // Match sources: the other cameras with white balance (online ones only:
  // an offline camera's values may be stale).
  const others = order.map(id => devices.get(id)).filter(t => t && t.id !== d.id && hasColour(t));
  const key = others.map(t => t.id + ":" + (t.info.name || "") + ":" + t.online).join("|");
  if (sh.match._key !== key) {
    sh.match._key = key;
    sh.match.replaceChildren(el("option", { value: "" }, "Match to..."),
      ...others.map(t => el("option", { value: t.id, disabled: !t.online }, (t.info.name || t.id) + (t.online ? "" : " (offline)"))));
  }
  const self = takesColour(d);
  const targets = others.filter(takesColour);
  sh.match.disabled = !self || !others.some(t => t.online);
  sh.match.title = refusesShading(d) ? OUTDATED_APP : "Give this camera another camera's white balance (temperature and tint)";
  sh.copyAll.disabled = !d.online || !targets.length;
  sh.copyAll.title = !targets.length && others.length
    ? "No other camera can take a colour now (offline, or an app to update)"
    : "Set this camera's white balance (temperature and tint) on every other camera";
  if (sh.once) {
    const r1 = d.online && refusesShading(d);
    sh.once.disabled = !d.online || r1;
    sh.once.title = r1 ? OUTDATED_APP : "Measure the white balance once, then hold it";
  }
  drawStats(d);
}

function updateShadeAll() {
  updateProductionBar();
  for (const id of order) updateShadeCard(devices.get(id));
}

function shadeError(d, text) {
  const sh = d.shade;
  if (!sh) return;
  sh.err.textContent = text;
  clearTimeout(sh.errTimer);
  sh.errTimer = setTimeout(() => { sh.err.textContent = ""; }, 8000);
}

// A hub notice (a refused production) stays for its full 8 s, whatever
// updates the bar meanwhile.
function shadeNotice(text) {
  if (!shadeBar) return;
  shadeBar.notice = text;
  shadeBar.noticeUntil = performance.now() + 8000;
  clearTimeout(shadeBar.timer);
  shadeBar.timer = setTimeout(updateProductionBar, 8050);
  updateProductionBar();
}

const SHUTTER_CHOICES = [["mains", "Mains"], ["free", "Free"], [100, "1/100"], [120, "1/120"], [200, "1/200"], [240, "1/240"]];

function buildShadeBar() {
  const scope = el("div", { class: "seg" }, ["waveform", "histogram"].map(m => el("button", {
    type: "button", "data-m": m,
    onclick: () => { scopeMode = m; storageSet("tallycamScope", m); updateShadeAll(); },
  }, m === "waveform" ? "Waveform" : "Histogram")));
  const mains = el("select", { "aria-label": "Production mains" },
    [[50, "50 Hz"], [60, "60 Hz"], [0, "Off"]].map(([v, l]) => el("option", { value: v }, l)));
  const shutter = el("select", { "aria-label": "Production shutter" });
  // Sent, then the selects show it until the hub's `production` event (or
  // an error) answers; a second change meanwhile builds on the first.
  const sendProduction = ev => {
    const sv = shutter.value;
    const p = { mains_hz: Number(mains.value), shutter: /^\d+$/.test(sv) ? Number(sv) : sv };
    shadeBar.sent = p;
    send({ type: "production", ...p });
    ev.target.blur();
    updateProductionBar();
  };
  mains.addEventListener("change", sendProduction);
  shutter.addEventListener("change", sendProduction);
  const note = el("span", { class: "note" });
  const bar = el("div", { class: "shade-bar" },
    el("label", { title: "Waveform or histogram on every camera (or click a scope)" }, "Scope", scope),
    el("span", { class: "spacer" }),
    el("span", { class: "title", title: "The production's settings, sent to every camera (protocol 2 and up)" }, "Production"),
    el("label", { title: "Mains frequency of the lights: the shutter avoids their flicker. Off: no mains-lit light, the shutter is free.\n" +
      "A camera may set its own mains (on the phone or in its panel) until the production changes again." }, "Mains", mains),
    el("label", { title: "Production shutter for every camera. Mains: one mains period (1/50 at 50 Hz). " +
      "Free (or mains off): set per camera in manual exposure" }, "Shutter", shutter),
    note);
  shadeBar = { root: bar, mains, shutter, note, scope, timer: null, notice: "", noticeUntil: 0, sent: null };
  return bar;
}

function updateProductionBar() {
  if (!shadeBar) return;
  const b = shadeBar;
  for (const btn of b.scope.children) btn.classList.toggle("active", btn.dataset.m === scopeMode);
  const p = b.sent || production || { mains_hz: 50, shutter: "mains" };
  // "Mains" says what it gives at the mains chosen.
  const mainsHz = Number(p.mains_hz);
  const choices = SHUTTER_CHOICES.map(([v, l]) =>
    [v, v === "mains" ? "Mains · " + (mainsHz === 0 ? "free" : "1/" + (mainsHz === 60 ? 60 : 50)) : l]);
  if (typeof p.shutter === "number" && !choices.some(([v]) => v === p.shutter)) choices.push([p.shutter, "1/" + p.shutter]);
  const key = choices.map(([v, l]) => v + "=" + l).join(",");
  if (b.shutter._key !== key) {
    b.shutter._key = key;
    b.shutter.replaceChildren(...choices.map(([v, l]) => el("option", { value: v }, l)));
  }
  if (document.activeElement !== b.mains) b.mains.value = String(p.mains_hz);
  if (document.activeElement !== b.shutter) b.shutter.value = String(p.shutter);
  const open = !!(ws && ws.readyState === WebSocket.OPEN);
  b.mains.disabled = !open;
  b.shutter.disabled = !open;
  if (performance.now() < b.noticeUntil) { b.note.textContent = b.notice; b.note.title = ""; return; }
  const own = [...devices.values()].filter(d => d.online && mainsNote(d));
  const notes = [];
  if (anyLive()) notes.push("Live cameras apply a change when their stream stops.");
  if (own.length) notes.push(own.length === 1 ? "1 camera has its own mains." : own.length + " cameras have their own mains.");
  b.note.textContent = notes.join(" ");
  b.note.title = own.map(d => (d.info.name || d.id) + ": " + mainsNote(d).short).join("\n");
}

function renderShade() {
  if (view !== "shading") return;
  const root = document.getElementById("shade");
  if (!shadeBar) root.append(buildShadeBar());
  let grid = document.getElementById("shade-grid");
  if (!grid) { grid = el("div", { id: "shade-grid" }); root.append(grid); }
  const cards = order.map(id => devices.get(id)).filter(Boolean).map(d =>
    !d.shade ? buildShadeCard(d) : d.shade.rebuild && !d.shade.dragging() ? rebuildShadeCard(d) : d.shade.root);
  grid.replaceChildren(...(cards.length ? cards : [el("div", { class: "none" }, "No cameras yet. Add one in the Cameras view.")]));
  updateShadeAll();
}

function setView(v) {
  view = v === "shading" ? "shading" : "cameras";
  storageSet("tallycamView", view);
  for (const b of document.querySelectorAll("#views button")) b.classList.toggle("active", b.dataset.view === view);
  const shading = view === "shading";
  document.getElementById("grid").hidden = shading;
  document.getElementById("tools").hidden = shading;
  document.getElementById("shade").hidden = !shading;
  scheduleWatch();
  if (shading) {
    document.getElementById("panel").classList.remove("open");
    renderShade();
  } else if (selected) {
    buildPanel();
  }
}

document.querySelectorAll("#views button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
window.addEventListener("resize", () => {
  if (view === "shading") for (const id of order) { const d = devices.get(id); if (d && d.shade) drawStats(d); }
});
scopeMode = storageGet("tallycamScope") === "histogram" ? "histogram" : "waveform";

// Keep the pending map bounded if a phone never answers.
setInterval(() => {
  if (pending.size > 500) {
    for (const k of [...pending.keys()].slice(0, pending.size - 500)) pending.delete(k);
  }
}, 10000);

// ---------------------------------------------------------------------------
// Connection
// ---------------------------------------------------------------------------

let backoff = 500;
function setConn(state, text) {
  document.getElementById("conn-dot").className = "dot" + (state === "on" ? " on" : state === "bad" ? " bad" : "");
  document.getElementById("conn-text").textContent = text;
  document.getElementById("conn-dot").parentElement.title = text;
}

// A WebSocket subprotocol must be an HTTP token (RFC 6455, RFC 7230 tchar).
const SUBPROTOCOL_TOKEN = /^[!#$%&'*+\-.^_`|~0-9A-Za-z]+$/;

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const url = proto + "//" + location.host + CONFIG.controlPath;
  // The operator token goes in Sec-WebSocket-Protocol (tallycam.token.<token>,
  // echoed by the hub), not the URL, so it stays out of access logs. A token
  // that is not a valid subprotocol (one set with --operator-token) falls
  // back to ?token=.
  if (OPERATOR_TOKEN && SUBPROTOCOL_TOKEN.test(OPERATOR_TOKEN)) {
    ws = new WebSocket(url, ["tallycam.token." + OPERATOR_TOKEN]);
  } else {
    ws = new WebSocket(url + (OPERATOR_TOKEN ? "?token=" + encodeURIComponent(OPERATOR_TOKEN) : ""));
  }
  setConn("", "connecting");
  ws.onopen = () => { backoff = 500; watchSent = undefined; setConn("on", "hub connected"); updateProductionBar(); };
  ws.onmessage = ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m && typeof m === "object") onMessage(m);
  };
  ws.onclose = () => {
    setConn("bad", "hub disconnected, retrying");
    for (const d of devices.values()) { d.online = false; d.status = null; d.imageStats = null; }
    renderGrid();
    if (selected) updatePanel();
    updateShadeAll();
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 5000);
  };
}

// ---------------------------------------------------------------------------
// Add a camera (provisioning v0: the QR code carries a deep link with the
// control and SRT URLs; see docs/PROTOCOL.md). The addresses come from the
// hub, never from location.host: a phone cannot reach "localhost".
// ---------------------------------------------------------------------------

let hubInfo = null;
let targetIndex = 0;
// Bumped when the Add dialog closes, so an invite that arrives after that is
// dropped instead of shown.
let inviteGen = 0;

// With invites (CONFIG.inviteUrl) each call creates a one-time invite, so it
// is only called when the Add dialog opens: never at page load, and the
// invite is only shown in the dialog and dropped when it closes.
async function loadInfo() {
  const gen = inviteGen;
  let info;
  try {
    if (CONFIG.inviteUrl) {
      // One target: a fresh one-time invite with its own QR code.
      const r = await fetch(CONFIG.inviteUrl, { method: "POST", cache: "no-store", headers: operatorHeaders() });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const inv = await r.json();
      let label = inv.control_url;
      try { label = new URL(inv.control_url).host; } catch (e) { /* keep the URL */ }
      info = { targets: [{ label, control_url: inv.control_url, srt_url: inv.srt_url || null,
                           deep_link: inv.deep_link, qr_svg: inv.qr_svg,
                           expires_in_secs: inv.expires_in_secs }] };
    } else {
      const r = await fetch(CONFIG.infoUrl, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      info = await r.json();
    }
  } catch (e) {
    info = { error: String(e.message || e), targets: [] };
  }
  if (CONFIG.inviteUrl && (gen !== inviteGen || document.getElementById("modal").hidden)) return;
  hubInfo = info;
  if (targetIndex >= hubInfo.targets.length) targetIndex = 0;
  renderAddCards();
}

// The "no cameras yet" card when the hub uses invites: the steps and a
// button that creates the invite, instead of a live code nobody asked for.
function buildInvitePrompt() {
  return el("div", { class: "add" },
    el("div", { class: "qr" },
      el("div", { class: "noqr" },
        el("button", { type: "button", class: "btn on", onclick: openAdd }, "Show a code and link"))),
    el("div", { class: "info" },
      el("h2", {}, "Add a camera"),
      el("p", {}, "No cameras yet."),
      el("ol", {},
        el("li", {}, "Install TallyCam on the phone."),
        el("li", {}, "Show a code and link here: each admits one new phone and expires after a while."),
        el("li", {}, "Scan the code with the phone's camera, or send it the link, and open it in TallyCam."))));
}

function buildAddCard(closable) {
  if (CONFIG.inviteUrl && !closable) return buildInvitePrompt();
  const info = hubInfo;
  const targets = info ? info.targets : [];
  const t = targets[targetIndex];
  const qr = el("div", { class: "qr" },
    t ? el("img", { src: t.qr_svg ? "data:image/svg+xml;charset=utf-8," + encodeURIComponent(t.qr_svg)
                                  : CONFIG.qrUrl + "?target=" + targetIndex + "&v=" + encodeURIComponent(t.deep_link),
                    alt: "QR code: " + t.deep_link, title: t.deep_link })
      : el("div", { class: "noqr" },
          !info ? "Loading..."
            : info.error ? "Could not ask the hub for its addresses: " + info.error
            : "No LAN address found. Connect this computer to the phone's network, or start the hub with --public-url."));
  const rows = [];
  if (targets.length > 1) {
    rows.push(el("dt", {}, "Address"), el("dd", {},
      el("select", {
        onchange: ev => { targetIndex = Number(ev.target.value); renderAddCards(); },
      }, targets.map((x, i) => el("option", { value: i, selected: i === targetIndex }, x.label)))));
  }
  if (targets.length) {
    rows.push(el("dt", {}, targets.length > 1 ? "Control URLs" : "Control URL"),
      el("dd", {}, targets.map(x => el("div", {}, el("code", {}, x.control_url)))));
  }
  if (t && t.srt_url) rows.push(el("dt", {}, "SRT URL"), el("dd", {}, el("code", {}, t.srt_url)));
  const join = t && joinLink(t);
  if (join) {
    const status = el("span", { class: "copied" });
    const flash = text => {
      status.textContent = text;
      clearTimeout(status._timer);
      status._timer = setTimeout(() => { status.textContent = ""; }, 2500);
    };
    const subject = "Join as a camera";
    const body = "Open this link on the phone that will be the camera (TallyCam must be installed):\n\n" + join +
      (t.expires_in_secs ? "\n\nThe link works for one phone and expires in " + Math.round(t.expires_in_secs / 60) + " minutes." : "");
    rows.push(el("dt", {}, "Link"), el("dd", {},
      el("div", {}, el("code", {}, join)),
      el("div", { class: "share" },
        el("button", {
          type: "button", class: "btn",
          onclick: async () => {
            flash(await copyText(join) ? "Copied" : "Copy failed: select the link and copy it");
          },
        }, "Copy link"),
        el("button", {
          type: "button", class: "btn",
          onclick: async () => {
            if (navigator.share) {
              try { await navigator.share({ title: subject, text: body }); } catch (e) { /* cancelled */ }
            } else {
              location.href = "mailto:?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
            }
          },
        }, navigator.share ? "Share..." : "E-mail..."),
        status)));
  }
  const card = el("div", { class: "add" },
    closable ? el("button", { class: "btn close", type: "button", onclick: closeAdd, title: "Close (Esc)" }, "Close") : null,
    qr,
    el("div", { class: "info" },
      el("h2", {}, "Add a camera"),
      el("ol", {},
        el("li", {}, "Install TallyCam on the phone."),
        el("li", {}, t && !isLocalUrl(t.control_url)
          ? "Any internet connection on the phone: Wi-Fi or mobile data."
          : "The phone on the same network as this hub: the same Wi-Fi, or a cable on the same network."),
        el("li", {}, "Scan the code with the phone's camera, or send it the link below, and open it in TallyCam.")),
      el("dl", {}, rows),
      t && t.srt_url && t.srt_url.includes("{device}")
        ? el("div", { class: "note" }, "The phone replaces {device} with its own stream id (cam- and the start of its device id).")
        : null,
      t && t.expires_in_secs
        ? el("div", { class: "note" }, "The code admits one new phone and expires in " +
            Math.round(t.expires_in_secs / 60) + " minutes. The phone gets its stream address when it is used in a flow.")
        : null));
  return card;
}

// True for an address only reachable on the local network (private,
// link-local or .local): the phone must then be on that network. A public
// address (--public-url, a proxy) works over any connection, 5G included.
function isLocalUrl(url) {
  let host;
  try { host = new URL(url).hostname.replace(/^\[|\]$/g, "").toLowerCase(); } catch (e) { return true; }
  if (host === "localhost" || host.endsWith(".local")) return true;
  const v4 = host.match(/^(\d+)\.(\d+)\.\d+\.\d+$/);
  if (v4) {
    const [a, b] = [Number(v4[1]), Number(v4[2])];
    return a === 10 || a === 127 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168)
      || (a === 169 && b === 254) || (a === 100 && b >= 64 && b <= 127);
  }
  // IPv6: unique local (fc00::/7) and link-local (fe80::/10).
  return /^f[cd]/.test(host) || /^fe[89ab]/.test(host);
}

// Copies text. The clipboard API needs a secure context (https or
// localhost); the page is often opened over http on a LAN address, so fall
// back to a selected textarea.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const area = el("textarea", { readonly: "" });
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.append(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { /* not allowed */ }
    area.remove();
    return ok;
  }
}

// A clickable http(s) link to the join page that opens `t.deep_link` in the
// app, on the control URL's host (which the phone can reach), or null.
function joinLink(t) {
  if (!CONFIG.joinPath || !t.deep_link || !t.control_url) return null;
  try {
    const u = new URL(t.control_url);
    const scheme = u.protocol === "wss:" ? "https:" : "http:";
    return scheme + "//" + u.host + CONFIG.joinPath + "#" + encodeURIComponent(t.deep_link);
  } catch (e) {
    return null;
  }
}

function renderAddCards() {
  document.getElementById("empty").replaceChildren(buildAddCard(false));
  const modal = document.getElementById("modal");
  if (!modal.hidden) modal.replaceChildren(buildAddCard(true));
}

function openAdd() {
  const modal = document.getElementById("modal");
  // A new invite each time: never the one shown (and maybe used) before.
  if (CONFIG.inviteUrl) hubInfo = null;
  modal.hidden = false;
  modal.replaceChildren(buildAddCard(true));
  loadInfo();
}

function closeAdd() {
  const modal = document.getElementById("modal");
  modal.hidden = true;
  if (CONFIG.inviteUrl) {
    // The invite leaves the page with the dialog.
    inviteGen++;
    hubInfo = null;
    modal.replaceChildren();
  }
}

document.getElementById("add-camera").addEventListener("click", openAdd);
document.getElementById("modal").addEventListener("click", ev => {
  if (ev.target.id === "modal") closeAdd();
});

document.addEventListener("keydown", ev => {
  // "/" finds a camera, as on many sites.
  const typing = ev.target instanceof HTMLInputElement || ev.target instanceof HTMLTextAreaElement ||
    ev.target instanceof HTMLSelectElement;
  if (ev.key === "/" && !typing && !ev.metaKey && !ev.ctrlKey && !ev.altKey && view === "cameras") {
    ev.preventDefault();
    document.getElementById("search").focus();
    return;
  }
  if (ev.key !== "Escape" || ev.target instanceof HTMLInputElement) return;
  if (!document.getElementById("modal").hidden) closeAdd();
  else if (selected) closePanel();
});
document.title = CONFIG.title;
document.querySelector("header h1").textContent = CONFIG.title;
if (CONFIG.clapperUrl) document.getElementById("clapper").href = CONFIG.clapperUrl;
else document.getElementById("clapper").remove();
renderAddCards();
// Addresses only (GET); an invite is created when the Add dialog opens.
if (!CONFIG.inviteUrl) loadInfo();
initTools();
setView(storageGet("tallycamView") || "cameras");
connect();
</script>
</body>
</html>
