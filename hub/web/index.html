<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TallyCam Control</title>
<style>
:root {
  --bg: #0d0f12;
  --panel: #15181d;
  --card: #1a1e24;
  --raised: #232831;
  --line: #2c323c;
  --text: #e3e7ee;
  --muted: #8a93a3;
  --faint: #5b6372;
  --accent: #4c9aff;
  --pvw: #1fbf4f;
  --pgm: #e5302f;
  --warn: #f0a020;
  --ok: #3ccf6e;
  /* As on the phones: manual yellow, a change from the
     other side cyan, CLIP red, DARK orange. */
  --held: #ffd23f;
  --other: #3fd8f0;
  --clip: #ff4d4d;
  --dark: #f0a020;
  --radius: 6px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}
button, input, select { font: inherit; color: inherit; }
header {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  flex: none;
}
header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .04em; text-transform: uppercase; }
header .spacer { flex: 1; }
header h1, header .conn, header .btn { white-space: nowrap; }
header .seg { flex-wrap: nowrap; flex: none; }
/* An iPad in portrait: the header stays one line. */
@media (max-width: 820px) {
  header { gap: 8px; padding: 8px 12px; }
  #count, #conn-text { display: none; }
}
.conn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex: none; }
.dot.on { background: var(--ok); }
.dot.bad { background: var(--pgm); }
main { flex: 1; display: flex; min-height: 0; }
#grid { flex: 1; overflow: auto; padding: 16px; min-width: 0; }
/* One grid of cards per section (all cameras, a tag, old offline ones). */
.cgrid {
  display: grid; gap: 12px; align-content: start;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  /* Rows as tall as their cards: never squeezed to fit the window. */
  grid-auto-rows: max-content;
}
.cgrid.compact { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.cgrid.compact .readout, .cgrid.compact .stats, .cgrid.compact .card-actions { display: none; }
#empty { padding: 24px 0; display: flex; justify-content: center; }
.sec + .sec { margin-top: 16px; }
.sec-head {
  display: flex; align-items: center; gap: 8px; margin: 0 0 8px;
  font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
}
.sec-head:empty { display: none; }
button.sec-head {
  width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 8px 12px; cursor: pointer; text-align: left; font-size: 12px; color: var(--text);
}
button.sec-head:hover { background: var(--raised); }
.sec .none { color: var(--muted); padding: 8px 0; }

/* Toolbar of the Cameras view: search, filters, sort, density. */
#tools {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none;
}
#tools[hidden] { display: none; }
#tools input[type=search], #tools select {
  background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; min-height: 28px;
}
#tools input[type=search] { flex: 1 1 180px; min-width: 120px; max-width: 320px; }
#tools select { max-width: 160px; }
#tools .seg button .n { color: var(--muted); margin-left: 5px; font-variant-numeric: tabular-nums; }
#tools .seg button.active .n { color: inherit; opacity: .8; }
.btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on:hover:not(:disabled) { background: var(--accent); filter: brightness(1.15); }
@media (max-width: 820px) {
  #tools { padding: 8px 12px; }
  #tools input[type=search] { max-width: none; flex-basis: 100%; }
}

/* Add a camera (empty state and modal) */
.add {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; max-width: 760px; width: 100%;
  display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start;
}
.add h2 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
.add .qr { flex: none; width: 280px; max-width: 100%; }
.add .qr img { display: block; width: 100%; aspect-ratio: 1; background: #fff; border-radius: 4px; image-rendering: pixelated; }
.add .qr .noqr { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  border: 1px dashed var(--line); border-radius: 4px; color: var(--muted); padding: 16px; }
.add .info { flex: 1; min-width: 240px; }
.add ol { margin: 0 0 14px; padding-left: 20px; color: var(--text); }
.add ol li { margin-bottom: 4px; }
.add dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; }
.add dt { color: var(--muted); }
.add dd { margin: 0; min-width: 0; }
.add code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; color: var(--text); }
.add select { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; max-width: 100%; }
.add .note { color: var(--muted); font-size: 12px; margin-top: 12px; }
.add .share { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.add .copied { color: var(--muted); font-size: 12px; }
#modal {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 50;
  display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; overflow: auto;
}
#modal[hidden] { display: none; }
#modal .add { position: relative; }
#modal .add .btn.close { position: absolute; top: 10px; right: 10px; }

/* Camera card */
.card {
  background: var(--card); border: 3px solid var(--line); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
  transition: border-color .1s;
}
.card.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
/* Hidden on this screen, shown again with "Hidden (n)". */
.card.is-hidden, .dlist tr.is-hidden { opacity: .45; }
.card.dragging { opacity: .5; }
.card.drop-before { box-shadow: -5px 0 0 0 var(--accent); }
.card.drop-after { box-shadow: 5px 0 0 0 var(--accent); }
/* Reorder handle, only while the order is the custom one. */
.drag { display: none; color: var(--faint); cursor: grab; padding: 0 2px; touch-action: none; user-select: none; -webkit-user-select: none; flex: none; }
.cgrid.reorder .drag { display: inline; }
.mini {
  background: none; border: 1px solid transparent; border-radius: 3px; color: var(--faint);
  font-size: 11px; padding: 0 4px; cursor: pointer; flex: none; line-height: 1.5;
}
.mini:hover { color: var(--text); border-color: var(--line); }
/* The operator's tags. */
.utags { display: inline-flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.utags:empty { display: none; }
.utag {
  font-size: 11px; line-height: 1.5; padding: 0 6px; border-radius: 9px; white-space: nowrap;
  background: var(--raised); border: 1px solid var(--line); color: var(--text);
  display: inline-flex; align-items: center; gap: 2px;
}
.utag .x { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 0 0 2px; font-size: 13px; line-height: 1; }
.utag .x:hover { color: var(--text); }
.media .utags {
  position: absolute; top: 6px; right: 6px; max-width: 65%; flex-wrap: nowrap; overflow: hidden; justify-content: flex-end;
}
.media .utag, .dlist .utag { display: block; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.media .utag { background: rgba(13, 15, 18, .75); flex: none; }
.tagedit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tagedit input {
  flex: 1 1 140px; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px;
}
/* List density. */
.lwrap { overflow-x: auto; }
.dlist {
  width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.dlist th {
  text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase;
  letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.dlist td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.dlist tr:last-child td { border-bottom: 0; }
.dlist tr.dev { cursor: pointer; }
.dlist tr.dev:hover { background: var(--raised); }
.dlist tr.selected td { background: rgba(76, 154, 255, .14); }
.dlist td.nm { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.dlist td.nm > span { vertical-align: middle; }
.dlist td.nm .name { font-weight: 600; margin-right: 6px; }
.dlist .muted { color: var(--muted); }
.card.tally-preview { border-color: var(--pvw); }
.card.tally-program { border-color: var(--pgm); }
.card.offline .media, .card.offline .stats { opacity: .45; }
.card-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; min-width: 0; }
.card-head .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.card-head .model { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
/* The tally colour on the camera name, as on an RCP. */
.name.t-program, .name.t-preview { padding: 0 6px; border-radius: 3px; }
.name.t-program { background: var(--pgm); color: #fff; }
.name.t-preview { background: var(--pvw); color: #04140a; }
/* Short notes next to the name: an app to update, a camera's own mains. */
.tags { display: inline-flex; gap: 4px; flex: none; }
.tags:empty { display: none; }
.tag {
  font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 3px; white-space: nowrap; cursor: help; line-height: 1.4;
}
.tag.update { background: var(--warn); color: #000; }
.tag.old { background: var(--raised); color: var(--muted); border: 1px solid var(--line); }
.tag.mains { color: var(--warn); border: 1px solid var(--warn); }
/* Always 16:9: a portrait camera is shown pillarboxed, so its card is not
   taller than the others. The image is positioned so it cannot stretch the
   box (aspect-ratio is only a preferred size). */
.media { position: relative; background: #000; aspect-ratio: 16 / 9; overflow: hidden; flex: none; }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.media .overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--faint); font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
}
.media .badge {
  position: absolute; top: 6px; left: 6px; padding: 1px 6px; border-radius: 3px;
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
}
.badge.live { background: var(--pgm); color: #fff; }
.badge.connecting { background: var(--warn); color: #000; }
.badge.error { background: #7a1010; color: #fff; }
/* An exposure warning: auto ISO at its limit, or clipping / too dark. */
.media .xwarn {
  position: absolute; bottom: 6px; left: 6px; padding: 1px 6px; border-radius: 3px;
  font-size: 11px; font-weight: 700; letter-spacing: .06em; background: var(--dark); color: #000;
}
.media .xwarn.clip { background: var(--clip); color: #fff; }
.media .xwarn:empty { display: none; }
/* The current values on one line, as on the phones: manual in yellow. */
/* Every value stays visible: a narrow card wraps between values, never
   inside one. */
.readout {
  padding: 4px 8px 0; font-size: 12px; line-height: 1.5; font-weight: 500;
  font-variant-numeric: tabular-nums; color: var(--text);
  display: flex; flex-wrap: wrap; align-items: baseline; row-gap: 0;
}
.readout .part { white-space: nowrap; }
.readout:empty { display: none; }
.readout .m { color: var(--held); }
.readout .chg { color: var(--other); }
.readout .w-clip { color: var(--clip); font-weight: 700; }
.readout .w-dark { color: var(--dark); font-weight: 700; }
.readout .sep { color: var(--faint); padding: 0 5px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 6px 8px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--text); font-weight: 500; }
.chip { padding: 0 5px; border-radius: 3px; background: var(--raised); color: var(--muted); }
.chip.fair { color: #000; background: #d8c33a; }
.chip.serious { color: #000; background: var(--warn); }
.chip.critical { color: #fff; background: var(--pgm); }
.chip.low { color: #fff; background: var(--pgm); }
.chip.clk-healthy { color: #d9ffe6; background: #1d5f33; }
.chip.clk-degraded { color: #000; background: var(--warn); }
.chip.clk-bad { color: #fff; background: var(--pgm); }
.clock-pre {
  margin: 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
  font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text);
  white-space: pre; overflow-x: auto;
}
.clock-pre .muted { color: var(--muted); }
.card-actions { display: flex; gap: 6px; padding: 6px 8px 8px; margin-top: auto; align-items: center; }
.card-actions .seg { flex-wrap: nowrap; }
.card-actions .seg button { padding: 5px 8px; }
.card-actions .btn { white-space: nowrap; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; flex-wrap: wrap; }
.seg button {
  background: var(--raised); border: 0; border-right: 1px solid var(--line);
  padding: 5px 9px; cursor: pointer; min-height: 28px;
}
.seg button:last-child { border-right: 0; }
.seg button:hover:not(:disabled):not(.active) { background: #2d3440; }
.seg button.active { background: var(--accent); color: #fff; }
/* Manual stands out from auto, as on the phones. */
.seg button.active.held { background: var(--held); color: #000; }
.seg.tally button.active.t-off { background: #4a5160; }
.seg.tally button.active.t-preview { background: var(--pvw); color: #04140a; }
.seg.tally button.active.t-program { background: var(--pgm); color: #fff; }
a.btn { color: inherit; text-decoration: none; display: inline-flex; align-items: center; }
.btn {
  background: var(--raised); border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 10px; cursor: pointer; min-height: 28px;
}
.btn:hover:not(:disabled):not(.is-live) { background: #2d3440; }
/* A selected button keeps its colour under the pointer, a little lighter. */
.seg button.active:hover:not(:disabled), .btn.is-live:hover:not(:disabled) { filter: brightness(1.15); }
.btn:disabled, .seg button:disabled { opacity: .45; cursor: default; }
.btn.golive { margin-left: auto; font-weight: 600; }
.btn.golive.is-live { background: var(--pgm); border-color: var(--pgm); color: #fff; }

/* Control panel */
#panel {
  width: 440px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
  overflow: auto; display: none;
}
#panel.open { display: block; }
@media (max-width: 1200px) {
  #panel { width: 380px; }
}
@media (max-width: 860px) {
  #panel { position: fixed; inset: 0; width: auto; z-index: 10; border-left: 0; }
}
.p-head {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2;
}
.p-head .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.p-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.p-head .sub { color: var(--muted); font-size: 11px; }
.p-head .close { margin-left: auto; }
.p-body { padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.p-media { cursor: crosshair; border-radius: 4px; overflow: hidden; }
.p-media.nofocus { cursor: default; }
.marker {
  position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border: 2px solid #ffd200; pointer-events: none; display: none;
}
.hint { color: var(--faint); font-size: 11px; margin-top: 4px; }
.group h3 {
  margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em;
}
.group .rows { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.row {
  display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center;
  padding: 7px 10px; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row > label { color: var(--muted); min-width: 0; }
.row > label .lt { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.disabled > label .lt { color: var(--faint); }
.row.disabled .ctl { opacity: .5; }
/* Why a control cannot be set now (or how it differs), under its label. */
.why { display: block; font-size: 10px; line-height: 1.3; color: var(--warn); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.why:empty { display: none; }
.why.info { color: var(--muted); }
.group-note { color: #000; background: var(--warn); border-radius: var(--radius) var(--radius) 0 0; padding: 4px 10px; font-size: 12px; }
.group-note:empty { display: none; }
.ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ctl input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); height: 24px; }
.num {
  width: 78px; text-align: right; background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 6px; font-variant-numeric: tabular-nums;
}
.unit { color: var(--faint); font-size: 11px; min-width: 26px; }
.ctl select, .ctl input[type=text] {
  flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px;
}
.ctl input.num { flex: none; }
.toggle {
  width: 42px; height: 22px; border-radius: 11px; border: 1px solid var(--line); background: var(--raised);
  position: relative; cursor: pointer; padding: 0; flex: none;
}
.toggle::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--muted); transition: left .1s;
}
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle.on::after { left: 22px; background: #fff; }
.toggle:disabled { cursor: default; }
.cmds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cmd { display: inline-flex; gap: 4px; align-items: center; }
.cmd input { width: 52px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
.msg { display: flex; gap: 6px; }
.msg input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
#log {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
  height: 150px; overflow: auto; padding: 6px 8px;
  font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
#log .l { white-space: pre-wrap; word-break: break-word; }
#log .t { color: var(--faint); margin-right: 6px; }
#log .warn { color: var(--warn); }
#log .error { color: #ff6b6b; }
#log .info { color: var(--text); }
#log .debug { color: var(--muted); }
.offline-note { color: var(--warn); font-size: 12px; }
.offline-note:empty { display: none; }

/* Shading view */
#shade { flex: 1; overflow: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
#shade[hidden], #grid[hidden] { display: none; }
.shade-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px;
}
.shade-bar label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.shade-bar .title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.shade-bar select, .shade-card select {
  background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px;
}
.shade-bar .note { color: var(--warn); font-size: 12px; }
.shade-bar .note:empty { display: none; }
.shade-bar .spacer { flex: 1; }
#shade-grid {
  display: grid; gap: 12px; align-content: start;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  grid-auto-rows: max-content;
}
#shade-grid .none { color: var(--muted); padding: 16px 0; }
.shade-card {
  background: var(--card); border: 3px solid var(--line); border-radius: var(--radius);
  display: flex; flex-direction: column; overflow: hidden;
}
.shade-card.tally-preview { border-color: var(--pvw); }
.shade-card.tally-program { border-color: var(--pgm); }
.shade-card.offline .media, .shade-card.offline .scope { opacity: .45; }
.scope { display: block; width: 100%; height: 96px; background: #07090b; border-top: 1px solid var(--line); }
.meter { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 4px 8px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.meter b { color: var(--text); font-weight: 500; }
.meter .hot { color: var(--warn); }
.shade-ctl { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px 8px; border-top: 1px solid var(--line); }
.shade-ctl .group-note { border-radius: 4px; margin-bottom: 2px; }
.srow { display: grid; grid-template-columns: 66px minmax(0, 1fr) 62px; gap: 8px; align-items: center; min-height: 26px; }
.srow.first { margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--line); }
.srow > label { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .cell { position: relative; min-width: 0; display: flex; align-items: center; height: 24px; }
.srow input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
.srow .cell select { width: 100%; min-width: 0; font-size: 12px; }
.srow .fixed { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .sval { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.srow .sval.held { color: var(--held); }
.srow .sval.mode { color: var(--muted); font-size: 11px; }
.srow.disabled > label, .srow.disabled .sval { color: var(--faint); }
.srow.disabled input[type=range], .srow.disabled select { opacity: .35; }
/* The reason, over the dimmed control it disables. */
.srow .cell .why {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; font-size: 11px; font-weight: 600; letter-spacing: .02em;
}
.srow .cell .why:empty { display: none; }
.srow .seg { flex-wrap: nowrap; }
.srow .seg button { padding: 0 10px; min-height: 22px; font-size: 12px; font-weight: 600; min-width: 30px; }
.shade-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px 8px; align-items: center; }
.shade-actions .btn { padding: 2px 8px; min-height: 26px; font-size: 12px; }
.shade-actions select { min-width: 0; flex: 1 1 120px; max-width: 170px; font-size: 12px; min-height: 26px; }
.shade-err { color: #ff6b6b; font-size: 12px; padding: 0 8px 6px; }
.shade-err:empty { display: none; }
</style>
</head>
<body>
<header>
  <h1>TallyCam Control</h1>
  <span class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">connecting</span></span>
  <div class="seg" id="views">
    <button type="button" data-view="cameras">Cameras</button>
    <button type="button" data-view="shading">Shading</button>
  </div>
  <span class="spacer"></span>
  <span class="conn" id="count"></span>
  <a class="btn" id="clapper" href="/clapper" target="_blank" title="Flash and beep on every whole second: film it to check A/V sync">Clapper</a>
  <button class="btn" id="add-camera" type="button">Add camera</button>
</header>
<div id="tools" hidden>
  <input id="search" type="search" placeholder="Search name, model, id, tag  ( / )" aria-label="Search cameras" autocomplete="off" spellcheck="false">
  <div class="seg" id="filters"></div>
  <select id="tag-filter" aria-label="Show cameras with this tag"></select>
  <select id="sort" aria-label="Sort" title="Order of the cameras">
    <option value="custom">Custom order</option>
    <option value="name">Name</option>
    <option value="tally">Tally first</option>

  </select>
  <div class="seg" id="density">

    <button type="button" data-d="list">List</button>
  </div>
  <button class="btn" id="group" type="button" aria-pressed="false" title="A section per tag (a camera with several tags shows in each)">Group by tag</button>
  <button class="btn" id="hidden-chip" type="button" hidden title="Cameras hidden on this screen: show them, dimmed">Hidden</button>
</div>
<datalist id="tag-options"></datalist>
<main>
  <div id="grid"><div id="empty"></div><div id="sections"></div></div>
  <aside id="panel"></aside>
  <div id="shade" hidden></div>
</main>
<div id="modal" hidden></div>
<!--TALLYCAM_CONFIG-->
<script>
"use strict";

// ---------------------------------------------------------------------------
// Where this page finds its hub. The standalone hub serves it as is; a server
// that embeds the hub (Strom) replaces the TALLYCAM_CONFIG comment above with
// a script that sets window.TALLYCAM_CONFIG, overriding any of these.
// ---------------------------------------------------------------------------

const CONFIG = Object.assign({
  // Controller WebSocket path on this host.
  controlPath: "/lcp/v0/control",
  // GET: addresses and deep links (standalone hub, provisioning v0).
  infoUrl: "/api/info",
  // GET ?target=<i>: the deep link of one target as a QR code.
  qrUrl: "/api/connect.svg",
  // The clapper page, or null to hide the button.
  clapperUrl: "/clapper",
  // Path of the join page (JOIN_HTML) on the control URL's host, for a link
  // that can be sent by e-mail or message; null hides it.
  joinPath: "/join",
  // POST: a one-time invite { deep_link, control_url, qr_svg, expires_in_secs }.
  // When set it replaces infoUrl and qrUrl.
  inviteUrl: null,
  // DELETE <devicesUrl>/<device id>: forget (revoke) a camera, or null to
  // hide the button.
  devicesUrl: null,
  // Page title and header.
  title: "TallyCam Control",
  // True when the server needs an operator token: the page takes it from
  // its URL fragment (#token=..., never sent to the server), keeps it for
  // the tab, and sends it with invites, forgets and the controller socket.
  operatorToken: false,
}, window.TALLYCAM_CONFIG || {});

// The fragment as the page was opened, without any operator token: the
// view (#f=online&s=name...) or a camera to open (#<device id>).
const HASH_PARTS = location.hash.slice(1).split("&").filter(Boolean);
const HASH_TOKEN = HASH_PARTS.find(p => p.startsWith("token="));
const INITIAL_HASH = (rest => rest ? "#" + rest : "")(HASH_PARTS.filter(p => !p.startsWith("token=")).join("&"));
// The token leaves the address bar (and history) at once; the rest of the
// fragment stays.
if (HASH_TOKEN !== undefined) {
  try { history.replaceState(null, "", location.pathname + location.search + INITIAL_HASH); } catch (e) { /* sandboxed */ }
}

const OPERATOR_TOKEN = (() => {
  if (!CONFIG.operatorToken) return null;
  if (HASH_TOKEN && HASH_TOKEN.length > "token=".length) {
    // Kept decoded, as it is used: a reload reads it back from storage.
    let token = HASH_TOKEN.slice("token=".length);
    try { token = decodeURIComponent(token); } catch (e) { /* malformed escape: use as is */ }
    try { sessionStorage.setItem("operatorToken", token); } catch (e) { /* private mode */ }
    return token;
  }
  try { return sessionStorage.getItem("operatorToken"); } catch (e) { return null; }
})();

function operatorHeaders() {
  return OPERATOR_TOKEN ? { "X-Operator-Token": OPERATOR_TOKEN } : {};
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const devices = new Map();   // id -> device record (see addDevice)
const order = [];            // card order
let ws = null;
let selected = null;         // device id shown in the panel
let panel = null;            // { id, updaters: Map(controlId -> fn), logEl, media, msgButton }
let nextId = Math.floor(Math.random() * 1e6) * 1000;
const pending = new Map();   // set/command id -> description, for failed results
const GROUP_ORDER = ["stream", "lens", "exposure", "white_balance", "focus", "image", "audio"];
const LOG_MAX = 300;

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}

// Values a device reports that become CSS classes: only the known ones, so a
// device cannot put arbitrary classes on the page. Anything else gets
// `fallback` (a class with no style of its own, or a neutral one).
const STREAM_STATES = new Set(["idle", "connecting", "live", "error"]);
const LOG_LEVELS = new Set(["debug", "info", "warn", "error"]);
const THERMAL_STATES = new Set(["nominal", "fair", "serious", "critical"]);
const CLOCK_HEALTH = new Set(["healthy", "degraded", "bad"]);
function known(set, v, fallback) {
  return typeof v === "string" && set.has(v) ? v : fallback;
}

function same(a, b) {
  if (typeof a === "number" || typeof b === "number") return Number(a) === Number(b);
  return a === b;
}

function prettyGroup(g) {
  return (g || "other").replace(/_/g, " ");
}

function decimalsFor(step) {
  if (!step || step >= 1) return 0;
  return Math.min(6, Math.max(0, Math.ceil(-Math.log10(step) - 1e-9)));
}

function fmtNum(v, step) {
  if (typeof v !== "number" || !isFinite(v)) return v === undefined || v === null ? "" : String(v);
  return v.toFixed(decimalsFor(step));
}

function now() {
  return new Date().toTimeString().slice(0, 8);
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// What this page just set, so its state echo does not flash as a change
// from the phone.
function noteSent(device, keys) {
  const d = devices.get(device);
  if (!d) return;
  const t = performance.now();
  for (const k of keys) d.sentAt[k] = t;
}

const COMMAND_CONTROLS = {
  focus_at: ["focus_mode", "focus_position"],
  wb_one_shot: ["wb_mode", "wb_temperature", "wb_tint"],
};

function sendSet(device, values, withId) {
  noteSent(device, Object.keys(values));
  const msg = { type: "set", device, values };
  if (withId) {
    msg.id = ++nextId;
    pending.set(msg.id, { device, what: "set " + Object.keys(values).join(", ") });
  }
  send(msg);
}

function sendCommand(device, name, args) {
  noteSent(device, COMMAND_CONTROLS[name] || []);
  const id = ++nextId;
  pending.set(id, { device, what: "command " + name });
  const msg = { type: "command", device, id, name };
  if (args && Object.keys(args).length) msg.args = args;
  send(msg);
}

function addLog(id, level, text) {
  const d = devices.get(id);
  if (!d) return;
  const entry = { t: now(), level: level || "info", text: String(text) };
  d.log.push(entry);
  if (d.log.length > LOG_MAX) d.log.shift();
  if (panel && panel.id === id) appendLogLine(entry);
}

// ---------------------------------------------------------------------------
// Device records
// ---------------------------------------------------------------------------

function addDevice(id) {
  let d = devices.get(id);
  if (d) return d;
  d = {
    id, info: { id, name: id }, controls: [], commands: [], state: {}, status: null,
    preview: null, tally: "off", online: false, log: [], card: null, keyFingerprint: null,
    protocol: 0, imageStats: null, shade: null, isoLimit: null,
    // When this page last set each control, and readout parts to flash.
    sentAt: {}, flash: {}, flashTimer: null,
    // The operator's tags, and when the hub last saw it (unix seconds).
    tags: [], lastSeen: null,
    // Cards and list rows by section key ("" for the first; a camera with
    // several tags has one per tag section), and what places it (viewKey).
    cards: new Map(), rows: new Map(), vk: "",
  };
  devices.set(id, d);
  order.push(id);
  return d;
}

function controlById(d, cid) {
  return d.controls.find(c => c.id === cid);
}

// The controls of exposure, colour and focus, which a protocol 2 phone (the
// 0.2.0 apps) refuses from the hub, and the commands of those groups.
const SHADING_IDS = new Set(["exposure_mode", "iso", "shutter", "ev_bias", "wb_mode", "wb_temperature",
  "wb_tint", "focus_mode", "focus_position", "focus_at", "wb_one_shot"]);
// hello.protocol: 2 adds production and image statistics, 3 drops ownership.
const SHADE_PROTOCOL = 2;
const OWNERSHIP_PROTOCOL = 2;
const OUTDATED_APP = "This app version (TallyCam 0.2.0, protocol 2) refuses exposure, colour and focus " +
  "from the hub. Update TallyCam on the phone.";
const OLDER_APP = "An older TallyCam (protocol 1): exposure, colour and focus work, but it takes no " +
  "production settings (mains, shutter) and sends no image statistics. Update TallyCam on the phone.";

function refusesShading(d) {
  return d.protocol === OWNERSHIP_PROTOCOL;
}

const MODE_GROUP = { exposure_mode: "exposure", wb_mode: "white balance", focus_mode: "focus" };

// Why `c` cannot be set now, or null when it can: { short, long, wide }.
// `short` is the inline note, `long` the tooltip; `wide` marks a reason
// that covers the whole camera (offline, an app to update), which is shown
// once rather than on every row. `assume`: values the same request sets too
// (the shading view sends exposure_mode manual along with an ISO), so
// `enabled_when` is checked against the state after it. Controls are
// disabled only for `readonly`, `enabled_when` and `locked_while_live`, plus
// a camera that is offline or refuses the shader.
function disabledReason(d, c, assume) {
  if (!c) return { short: "", long: "This camera has no such control", wide: true };
  if (!d.online) return { short: "Offline", long: "The camera is offline", wide: true };
  if (refusesShading(d) && SHADING_IDS.has(c.id)) return { short: "Update app", long: OUTDATED_APP, wide: true };
  if (c.readonly) {
    return c.id === "shutter"
      ? { short: "Production", long: "The shutter is a production setting. It is set per camera only when it is free: " +
          "Shutter Free, or Mains Off, in the Shading view's production bar." }
      : c.readonly_reason
        ? { short: "Read-only", long: "Read-only: " + c.readonly_reason }
        : { short: "Read-only", long: "Read-only: the camera reports it, nobody sets it" };
  }
  if (c.locked_while_live && isLiveState(d))
    return { short: "Not while live", long: "Refused while the camera is live: stop its stream to change it" };
  const cond = c.enabled_when;
  if (!cond) return null;
  const state = assume ? { ...d.state, ...assume } : d.state;
  // A list means any of its values.
  const unmet = Object.entries(cond).filter(([k, v]) =>
    !(Array.isArray(v) ? v.some(x => same(state[k], x)) : same(state[k], v)));
  if (!unmet.length) return null;
  const [k, v] = unmet[0];
  const vs = Array.isArray(v) ? v.map(String) : [String(v)];
  const word = vs.join(" or ");
  return {
    short: (MODE_GROUP[k] ? word.charAt(0).toUpperCase() + word.slice(1) : k + " " + word) + " only",
    long: "Writable when " + (MODE_GROUP[k] ? MODE_GROUP[k] + " is " + word : k + " is " + word) +
      " (" + unmet.map(([a, b]) => a + " = " + (Array.isArray(b) ? b.join(" or ") : b)).join(", ") + ")",
  };
}

function isEnabled(d, c, assume) {
  return !disabledReason(d, c, assume);
}

function isAuto(mode) {
  return mode === undefined || mode === "auto";
}

// ---------------------------------------------------------------------------
// Readout: the current values on one line, as the phones show them
// ("1080p30 · ISO 26 · 1/100 · +0.3 EV · 5200 K +4 · AF", docs/UI_DESIGN.md).
// A value of a group in manual is yellow (an older phone's "locked" too), auto is
// plain; a value changed from the other side (the phone, or another page)
// is cyan for a second.
// ---------------------------------------------------------------------------

// The controls behind each readout part: a part flashes when one of them
// changed and this page did not just set it.
const PART_CONTROLS = {
  format: ["resolution", "frame_rate"],
  iso: ["exposure_mode", "iso"],
  shutter: ["exposure_mode", "shutter"],
  ev: ["exposure_mode", "ev_bias"],
  wb: ["wb_mode", "wb_temperature", "wb_tint"],
  focus: ["focus_mode", "focus_position"],
};
const FLASH_MS = 1000;
// A state echo within this long of a set from this page is its own.
const ECHO_MS = 2500;

function fmtFormat(s) {
  const num = v => typeof v === "number" && isFinite(v);
  const res = s.resolution === "2160p" ? "4K" : s.resolution ? String(s.resolution) : "";
  if (res && num(s.frame_rate)) return res + s.frame_rate;
  if (res) return res;
  if (num(s.frame_rate)) return s.frame_rate + " fps";
  return "";
}

function fmtEv(v) {
  return (v > 0 ? "+" : v < 0 ? "-" : "") + Math.abs(v).toFixed(1) + " EV";
}

function fmtTint(v) {
  const t = Math.round(v);
  return (t > 0 ? "+" : t < 0 ? "-" : "") + Math.abs(t);
}

function fmtWb(s) {
  if (typeof s.wb_temperature !== "number") return "";
  const tint = typeof s.wb_tint === "number" ? Math.round(s.wb_tint) : 0;
  return Math.round(s.wb_temperature) + " K" + (tint ? " " + fmtTint(tint) : "");
}

function fmtFocus(s) {
  if (s.focus_mode === "auto") return "AF";
  // An older phone's "locked" is manual focus too.
  if (s.focus_mode === "manual" || s.focus_mode === "locked")
    return typeof s.focus_position === "number" ? "F " + s.focus_position.toFixed(2) : "F";
  return "";
}

// The exposure word after ISO, the phones' rule from the image statistics:
// CLIP over 2% clipped, DARK when the 99th percentile is below a third.
function statsWarning(d) {
  const l = d.online && d.imageStats && d.imageStats.luma;
  if (l && l.clipped > 0.02) return "clip";
  if (l && typeof l.p99 === "number" && l.p99 < 0.33) return "dark";
  return "";
}

// [{ key, text, held, warn? }]
function readoutParts(d) {
  const s = d.state || {};
  const parts = [];
  const num = v => typeof v === "number" && isFinite(v);
  const format = fmtFormat(s);
  if (format) parts.push({ key: "format", text: format, held: false });
  const expHeld = !isAuto(s.exposure_mode);
  if (num(s.iso)) parts.push({ key: "iso", text: "ISO " + Math.round(s.iso), held: expHeld, warn: statsWarning(d) });
  if (num(s.shutter)) parts.push({ key: "shutter", text: fmtShutter(s.shutter), held: expHeld });
  if (!expHeld && num(s.ev_bias) && Math.abs(s.ev_bias) >= 0.05) parts.push({ key: "ev", text: fmtEv(s.ev_bias), held: false });
  const wb = fmtWb(s);
  if (wb) parts.push({ key: "wb", text: wb, held: !isAuto(s.wb_mode) });
  const focus = fmtFocus(s);
  if (focus) parts.push({ key: "focus", text: focus, held: s.focus_mode !== "auto" });
  return parts;
}

// Before a state delta is applied: which parts the other side changed. Auto
// values drift all the time (what auto exposure measured), so only a mode
// change, a held value or a deliberate one (EV, format) flashes.
function noteChanges(d, values) {
  const t = performance.now();
  const before = new Map(readoutParts(d).map(p => [p.key, p]));
  const next = { ...d, state: { ...d.state, ...values } };
  for (const p of readoutParts(next)) {
    const old = before.get(p.key);
    if (old && old.text === p.text && old.held === p.held) continue;
    const ctl = PART_CONTROLS[p.key].filter(k => k in values && !same(values[k], d.state[k]));
    if (!ctl.length) continue;
    if (ctl.some(k => t - (d.sentAt[k] || -1e9) < ECHO_MS)) continue;
    const modeChanged = old && old.held !== p.held;
    if (!(modeChanged || p.held || p.key === "ev" || p.key === "format")) continue;
    d.flash[p.key] = t + FLASH_MS;
  }
  clearTimeout(d.flashTimer);
  d.flashTimer = setTimeout(() => {
    forCards(d, c => updateReadout(d, c.readout));
    if (d.shade) updateReadout(d, d.shade.readout);
  }, FLASH_MS + 30);
}

function updateReadout(d, line) {
  const t = performance.now();
  const parts = readoutParts(d).map(p => ({ ...p, chg: (d.flash[p.key] || 0) > t }));
  const key = JSON.stringify(parts);
  if (line._key === key) return;
  line._key = key;
  const out = [];
  parts.forEach((p, i) => {
    // The separator ends a part, so a wrapped line starts with a value.
    const part = el("span", { class: "part" },
      p.chg || p.held ? el("span", { class: p.chg ? "chg" : "m" }, p.text) : p.text);
    if (p.warn === "clip") part.append(" ", el("span", { class: "w-clip", title: "Over 2% of the picture is clipped" }, "CLIP"));
    if (p.warn === "dark") part.append(" ", el("span", { class: "w-dark", title: "The brightest 1% of the picture is below a third" }, "DARK"));
    if (i < parts.length - 1) part.append(el("span", { class: "sep" }, "\u2502"));
    out.push(part);
  });
  line.title = "Manual values are yellow; cyan: just changed on the phone";
  line.replaceChildren(...out);
}

// How long the phone's "Auto ISO at ISO n, too dark/bright" log counts: it
// logs when the loop reaches a limit, not when it leaves it.
const ISO_LIMIT_MS = 20000;

// Exposure warning for the badge on the picture: auto ISO at its limit (the
// phone's warn log, while exposure is auto), else the image statistics.
function exposureWarning(d) {
  if (!d.online) return { text: "", cls: "" };
  const lim = d.isoLimit;
  if (lim && isAuto(d.state.exposure_mode) && performance.now() - lim.at < ISO_LIMIT_MS) return { text: lim.text, cls: "" };
  const w = statsWarning(d);
  if (w === "clip") return { text: "CLIPPING", cls: "clip" };
  if (w === "dark") return { text: "TOO DARK", cls: "" };
  return { text: "", cls: "" };
}

function showWarning(elem, d) {
  const w = exposureWarning(d);
  elem.textContent = w.text;
  elem.className = "xwarn" + (w.cls ? " " + w.cls : "");
}

// A device log line: remember an auto ISO limit.
function noteIsoLimit(d, message) {
  const m = /^Auto ISO at ISO [\d.]+, (too dark|too bright)/.exec(String(message || ""));
  if (!m) return;
  d.isoLimit = { text: "ISO LIMIT · " + m[1].toUpperCase(), at: performance.now() };
  setTimeout(() => { updateCard(d); updateShadeCard(d); }, ISO_LIMIT_MS + 50);
}

// Notes next to the camera name: an app to update (protocol 2 refuses the
// shader, protocol 1 and older lack production and statistics), and mains
// that differ from the production (a phone may set its own: the last write
// wins until the production changes).
function cameraTags(d) {
  const out = [];
  if (refusesShading(d)) out.push(el("span", { class: "tag update", title: OUTDATED_APP }, "Update app"));
  else if ((d.protocol || 0) < SHADE_PROTOCOL) out.push(el("span", { class: "tag old", title: OLDER_APP }, "Older app"));
  const m = mainsNote(d);
  if (m) out.push(el("span", { class: "tag mains", title: m.long }, m.short));
  return out;
}

// This camera's mains when it differs from the production, or null.
function mainsNote(d) {
  const hz = d.state.mains_hz;
  // A camera's own production (its flow's, set by the embedding server).
  const p = d.production || production;
  if (typeof hz !== "number" || !p || Number(p.mains_hz) === hz) return null;
  const own = hz === 0 ? "Mains off" : "Mains " + hz + " Hz";
  const prod = Number(p.mains_hz) === 0 ? "off" : p.mains_hz + " Hz";
  const why = (d.protocol || 0) < SHADE_PROTOCOL
    ? "This older app takes no production settings."
    : "Set for this camera (on the phone or here); the production applies again when it changes" +
      (isLiveState(d) ? ", or when this camera's stream stops" : "") + ".";
  return { short: own, long: own + " on this camera, the production says " + prod + ". " + why };
}

function setTags(holder, d) {
  const tags = cameraTags(d);
  const key = tags.map(t => t.className + t.textContent + t.title).join("|");
  if (holder._key === key) return;
  holder._key = key;
  holder.replaceChildren(...tags);
}

// ---------------------------------------------------------------------------
// Cards
// ---------------------------------------------------------------------------

// A card for `d`; built once per section it shows in (see cardFor).
function buildCard(d) {
  const img = el("img", { alt: "" });
  img.style.display = "none";
  const overlay = el("div", { class: "overlay" });
  const badge = el("span", { class: "badge" });
  badge.style.display = "none";
  const xwarn = el("span", { class: "xwarn" });
  const readout = el("div", { class: "readout" });
  const tally = el("div", { class: "seg tally" },
    ["off", "preview", "program"].map(t =>
      el("button", {
        class: "t-" + t, "data-t": t, title: "Tally " + t,
        onclick: ev => { ev.stopPropagation(); send({ type: "tally", device: d.id, state: t }); },
      }, t === "off" ? "Off" : t === "preview" ? "Preview" : "Program")));
  const golive = el("button", {
    class: "btn golive",
    onclick: ev => {
      ev.stopPropagation();
      sendSet(d.id, { live: d.state.live !== true }, true);
    },
  }, "Go Live");
  const tags = el("span", { class: "tags" });
  const utags = el("span", { class: "utags" });
  const hide = el("button", {
    class: "mini", type: "button",
    onclick: ev => { ev.stopPropagation(); setHidden(d.id, !hiddenIds.has(d.id)); },
  });
  const drag = el("span", { class: "drag", title: "Drag to reorder", "aria-hidden": "true" }, "\u283f");
  const card = el("div", { class: "card", onclick: () => select(d.id) },
    el("div", { class: "card-head" },
      drag, el("span", { class: "dot" }), el("span", { class: "name" }), tags, el("span", { class: "model" }), hide),
    el("div", { class: "media" }, img, overlay, badge, xwarn, utags),
    readout,
    el("div", { class: "stats" }),
    el("div", { class: "card-actions" }, tally, golive));
  card.dataset.id = d.id;
  const c = { root: card, img, overlay, badge, xwarn, readout, tally, golive, tags, utags, hide, dirty: true };
  dragSource(d, c, drag);
  dropTarget(d, card);
  if (cardObserver) cardObserver.observe(card);
  return c;
}

// The card of `d` for section key `key`, built when first needed. The one
// for "" is `d.card`.
function cardFor(d, key) {
  let c = d.cards.get(key);
  if (!c) {
    c = buildCard(d);
    d.cards.set(key, c);
    if (key === "") d.card = c;
  }
  return c;
}

// `fn` on each card of `d` that is on the page now; the others are marked
// to update when they are placed (applyView), so 200 cameras in list view
// or a collapsed section cost nothing per event.
function forCards(d, fn) {
  for (const c of d.cards.values()) {
    if (c.root.isConnected) fn(c);
    else c.dirty = true;
  }
}

function renderGrid() {
  document.getElementById("empty").style.display = order.length ? "none" : "";
  for (const id of order) {
    const d = devices.get(id);
    cardFor(d, "");
    updateCard(d);
  }
  scheduleView();
}

function updateCard(d) {
  forCards(d, c => updateCardEl(d, c));
  forRows(d, r => updateRow(d, r));
  noteViewKey(d);
}

function updateCardEl(d, c) {
  c.dirty = false;
  const r = c.root;
  r.classList.toggle("offline", !d.online);
  r.classList.toggle("is-hidden", hiddenIds.has(d.id));
  setUserTags(c.utags, d);
  c.hide.textContent = hiddenIds.has(d.id) ? "Show" : "Hide";
  c.hide.title = hiddenIds.has(d.id) ? "Show on this screen again" : "Hide on this screen (this browser only; not Forget)";
  r.classList.toggle("selected", selected === d.id);
  r.classList.toggle("tally-preview", d.tally === "preview");
  r.classList.toggle("tally-program", d.tally === "program");
  r.querySelector(".card-head .dot").className = "dot" + (d.online ? " on" : "");
  setName(r.querySelector(".card-head .name"), d);
  setTags(c.tags, d);
  r.querySelector(".card-head .model").textContent = d.info.model || "";

  updateMedia(d, c.img, c.overlay);
  const st = d.status && d.status.stream;
  const sstate = st && st.state;
  if (d.online && sstate && sstate !== "idle") {
    c.badge.style.display = "";
    c.badge.className = "badge " + known(STREAM_STATES, sstate, "other");
    c.badge.textContent = String(sstate).toUpperCase();
    c.badge.title = st.error || "";
  } else {
    c.badge.style.display = "none";
  }

  updateReadout(d, c.readout);
  showWarning(c.xwarn, d);
  r.querySelector(".stats").replaceChildren(...statusBits(d));

  for (const b of c.tally.children) b.classList.toggle("active", b.dataset.t === d.tally);
  const live = controlById(d, "live");
  c.golive.style.display = live ? "" : "none";
  const isLive = d.state.live === true;
  c.golive.textContent = isLive ? "Stop" : "Go Live";
  c.golive.classList.toggle("is-live", isLive);
  c.golive.disabled = !d.online || (live && !isEnabled(d, live));
}

// The camera name, in its tally colour.
function setName(name, d) {
  name.textContent = d.info.name || d.id;
  name.className = "name" + (d.tally === "program" ? " t-program" : d.tally === "preview" ? " t-preview" : "");
  name.title = (d.tally === "program" ? "On air (program). " : d.tally === "preview" ? "Preview. " : "") + d.id;
}

function updateMedia(d, img, overlay) {
  if (d.preview && d.preview.jpeg) {
    const src = "data:image/jpeg;base64," + d.preview.jpeg;
    if (img.src !== src) img.src = src;
    img.style.display = "";
  } else {
    img.style.display = "none";
  }
  overlay.textContent = !d.online ? "Offline" : (d.preview ? "" : "No preview");
  overlay.style.background = !d.online && d.preview ? "rgba(0,0,0,.55)" : "";
}

function statusBits(d) {
  const s = d.status;
  const out = [];
  if (!d.online) out.push(el("span", { class: "chip" }, "OFFLINE"));
  if (!s) { if (d.online) out.push(el("span", {}, "no status yet")); return out; }
  if (s.battery && typeof s.battery.level === "number") {
    const pct = Math.round(s.battery.level * 100);
    out.push(el("span", { class: pct < 20 ? "chip low" : "" },
      "BAT ", el("b", {}, pct + "%"), s.battery.charging ? " chg" : ""));
  }
  if (s.thermal) out.push(el("span", { class: "chip " + known(THERMAL_STATES, s.thermal, "other") }, s.thermal));
  const st = s.stream;
  if (st) {
    if (st.state === "live") {
      if (typeof st.bitrate_kbps === "number")
        out.push(el("span", {}, el("b", {}, (st.bitrate_kbps / 1000).toFixed(1)), " Mb/s"));
      if (typeof st.rtt_ms === "number")
        out.push(el("span", {}, "RTT ", el("b", {}, Math.round(st.rtt_ms)), " ms"));
      if (st.dropped) out.push(el("span", { class: "chip serious" }, st.dropped + " dropped"));
      if (st.latency) out.push(latencyBit(st));
    } else {
      out.push(el("span", { title: st.error || "" }, st.state + (st.error ? ": " + st.error : "")));
    }
  }
  if (s.network) out.push(el("span", {}, s.network));
  if (s.clock) out.push(clockBit(s.clock));
  return out;
}

// The phone's own clock discipline (status.clock): health (same model as
// Strom's clock health), estimated / maximum error, stratum and how many
// sources are selected (*) and combined (+). The tooltip lists the sources
// like `chronyc sources`.
function fmtUs(us) {
  if (typeof us !== "number") return "?";
  const a = Math.abs(us);
  if (a >= 1e6) return (us / 1e6).toFixed(2) + " s";
  if (a >= 1000) return (us / 1000).toFixed(a >= 1e5 ? 0 : 1) + " ms";
  return Math.round(us) + " \u00b5s";
}

function clockSourcesText(c) {
  const rows = (c.sources || []).map(s => {
    const off = typeof s.offset_us === "number" ? (s.offset_us >= 0 ? "+" : "") + fmtUs(s.offset_us) : "";
    const err = typeof s.error_us === "number" ? "+/- " + fmtUs(s.error_us) : "";
    const ago = typeof s.last_rx_s === "number" ? String(s.last_rx_s) : "-";
    return "^" + (s.state || "?") + " " + String(s.addr || s.name || "").padEnd(28) + " " +
      String(s.stratum ?? "").padStart(2) + " " + String(s.poll ?? "").padStart(4) + " " +
      (typeof s.reach === "number" ? s.reach.toString(8) : "").padStart(5) + " " + ago.padStart(6) + "  " +
      off.padStart(9) + " " + err;
  });
  return "MS Name/IP address              St Poll Reach LastRx  Last sample\n" + rows.join("\n");
}

function clockSummaryText(c) {
  const lines = [
    "Health: " + (c.health || "?") + (c.synced ? ", synchronised" : ", NOT synchronised"),
    ...(c.findings || []).map(f => "  - " + f),
    "Reference: " + (c.reference ? c.reference + (c.reference_name ? " (" + c.reference_name + ")" : "") : "-") +
      ", stratum " + (c.stratum ?? 0),
    "Est. error " + fmtUs(c.est_error_us) + ", max error " + fmtUs(c.max_error_us) +
      ", correction in flight " + fmtUs((c.system_offset_ns ?? 0) / 1000),
    "Last offset " + fmtUs((c.last_offset_ns ?? 0) / 1000) + ", RMS " + fmtUs((c.rms_offset_ns ?? 0) / 1000) +
      ", update interval " + (c.update_interval_s ?? 0) + " s",
    "Frequency " + (c.freq_ppm ?? 0).toFixed(3) + " ppm, skew " + (c.skew_ppm ?? 0).toFixed(3) + " ppm",
    "Root delay " + fmtUs(c.root_delay_us) + ", root dispersion " + fmtUs(c.root_dispersion_us),
    "Timescale " + (c.timescale || "?").toUpperCase() + ", TAI - UTC " + (c.tai_utc_s ?? "?") + " s, leap " + (c.leap || "?"),
  ];
  if (typeof c.device_offset_ms === "number") lines.push("Phone wall clock is " + (-c.device_offset_ms).toFixed(1) + " ms off");
  return lines.join("\n");
}

function clockBit(c) {
  const level = c.health || (c.synced ? "healthy" : "bad");
  const title = clockSummaryText(c) + "\n\nSources (" + (c.reachable ?? 0) + "/" + (c.total ?? 0) +
    " reachable):\n" + clockSourcesText(c);
  const label = c.synced ? "CLK" : "UNSYNCED";
  const parts = [label];
  if (c.synced) {
    parts.push(" \u00b1", el("b", {}, fmtUs(c.est_error_us)), " max " + fmtUs(c.max_error_us));
    parts.push(" st" + (c.stratum ?? 0));
  }
  parts.push(" " + (c.selected ?? 0) + "*" + (c.combined ?? 0) + "+");
  return el("span", { class: "chip clk-" + known(CLOCK_HEALTH, level, "other"), title }, ...parts);
}

// The phone's send pipeline latency (status.stream.latency): p50 / p95 / max
// per stage over the last second, plus the SRT latency the listener agreed.
const LATENCY_STAGES = [
  ["capture_to_encode_ms", "capture to encoder"],
  ["encode_ms", "encode"],
  ["mux_ms", "mux (TS)"],
  ["send_queue_ms", "send queue (first packet)"],
  ["send_frame_ms", "send queue (last packet)"],
  ["capture_to_send_ms", "capture to first packet sent"],
  ["audio_capture_to_encode_ms", "audio capture to encoder"],
  ["audio_encode_ms", "audio encode"],
  ["audio_capture_to_mux_ms", "audio capture to mux"],
];

function latencyText(st) {
  const l = st.latency || {};
  const f = v => (typeof v === "number" ? v.toFixed(1) : "-").padStart(6);
  const rows = LATENCY_STAGES.map(([k, label]) => {
    const p = l[k];
    return label.padEnd(30) + (p ? f(p.p50) + f(p.p95) + f(p.max) : "     -");
  });
  const lines = ["Stage (ms)                       p50   p95   max", ...rows];
  if (typeof st.srt_latency_ms === "number") lines.push("", "SRT latency (agreed) " + st.srt_latency_ms + " ms");
  if (st.late_video_frames || st.late_audio_frames)
    lines.push("Late (after PCR deadline): video " + (st.late_video_frames || 0) + ", audio " + (st.late_audio_frames || 0));
  return lines.join("\n");
}

function latencyBit(st) {
  const send = st.latency && st.latency.capture_to_send_ms;
  const parts = ["LAT ", el("b", {}, send ? Math.round(send.p50) : "-"), " ms"];
  if (typeof st.srt_latency_ms === "number") parts.push(" + SRT " + st.srt_latency_ms);
  const late = (st.late_video_frames || 0) + (st.late_audio_frames || 0);
  return el("span", { class: "chip" + (late ? " serious" : ""), title: latencyText(st) }, ...parts);
}

function updateLatencyPanel(d) {
  if (!panel || panel.id !== d.id || !panel.latencyEl) return;
  const st = d.status && d.status.stream;
  panel.latencyEl.textContent = st && st.latency ? latencyText(st) : "Not live.";
}

function updateClockPanel(d) {
  if (!panel || panel.id !== d.id || !panel.clockEl) return;
  const c = d.status && d.status.clock;
  panel.clockEl.textContent = c ? clockSummaryText(c) + "\n\n" + clockSourcesText(c) : "No clock status from this camera.";
}

// ---------------------------------------------------------------------------
// Control panel
// ---------------------------------------------------------------------------

function select(id) {
  const was = selected;
  selected = id;
  for (const x of new Set([was, id])) { const d = x && devices.get(x); if (d) updateCard(d); }
  buildPanel();
  scheduleWatch();
}

function closePanel() {
  const was = selected;
  selected = null;
  panel = null;
  const p = document.getElementById("panel");
  p.classList.remove("open");
  p.replaceChildren();
  const d = was && devices.get(was);
  if (d) updateCard(d);
  scheduleWatch();
}

function buildPanel() {
  // The shading view has no side panel; it is built again on the way back.
  if (view === "shading") return;
  const p = document.getElementById("panel");
  const d = selected && devices.get(selected);
  if (!d) { closePanel(); return; }
  p.classList.add("open");
  const scroll = p.scrollTop;
  panel = { id: d.id, updaters: new Map() };

  // Preview with click-to-focus.
  const hasFocusAt = d.commands.some(c => c.name === "focus_at");
  const img = el("img", { alt: "" });
  const overlay = el("div", { class: "overlay" });
  const marker = el("div", { class: "marker" });
  const media = el("div", { class: "media p-media" + (hasFocusAt ? "" : " nofocus") }, img, overlay, marker);
  if (hasFocusAt) {
    media.addEventListener("click", ev => {
      if (!d.online) return;
      const r = media.getBoundingClientRect();
      // The image is letterboxed inside a 16:9 box; map to the frame itself.
      const iw = d.preview && d.preview.width, ih = d.preview && d.preview.height;
      let fx = 0, fy = 0, fw = r.width, fh = r.height;
      if (iw && ih) {
        const s = Math.min(r.width / iw, r.height / ih);
        fw = iw * s; fh = ih * s; fx = (r.width - fw) / 2; fy = (r.height - fh) / 2;
      }
      const x = (ev.clientX - r.left - fx) / fw, y = (ev.clientY - r.top - fy) / fh;
      if (x < 0 || x > 1 || y < 0 || y > 1) return;
      sendCommand(d.id, "focus_at", { x: Math.round(x * 1000) / 1000, y: Math.round(y * 1000) / 1000 });
      marker.style.left = (ev.clientX - r.left) + "px";
      marker.style.top = (ev.clientY - r.top) + "px";
      marker.style.display = "block";
      clearTimeout(marker._t);
      marker._t = setTimeout(() => { marker.style.display = "none"; }, 1200);
    });
  }
  panel.media = { img, overlay };

  const body = el("div", { class: "p-body" },
    el("div", {}, media, hasFocusAt ? el("div", { class: "hint" }, "Click the picture to focus and expose at that point.") : null),
    el("div", { class: "offline-note", id: "offline-note" }));

  // The operator's tags: x removes one, Enter adds one.
  const tagInput = el("input", {
    type: "text", list: "tag-options", maxlength: "40", placeholder: "Add a tag",
    "aria-label": "Add a tag", spellcheck: "false",
  });
  tagInput.addEventListener("keydown", ev => {
    if (ev.key !== "Enter") return;
    const t = tagInput.value.trim();
    if (!t) return;
    send({ type: "tags", device: d.id, tags: [...d.tags, t] });
    tagInput.value = "";
  });
  panel.tagChips = el("span", { class: "utags" });
  body.append(el("div", { class: "group" }, el("h3", {}, "Tags"),
    el("div", { class: "tagedit" }, panel.tagChips, tagInput)));

  // Commands.
  const cmds = d.commands.filter(c => c.name);
  if (cmds.length) {
    body.append(el("div", { class: "group" }, el("h3", {}, "Commands"),
      el("div", { class: "cmds" }, cmds.map(c => commandWidget(d, c)))));
  }

  // Controls grouped by group, suggested groups first.
  const groups = new Map();
  for (const c of d.controls) {
    const g = c.group || "other";
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(c);
  }
  const names = [...groups.keys()].sort((a, b) => {
    const ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  panel.groupNotes = [];
  for (const g of names) {
    // A protocol 2 phone refuses these groups: one note for the group.
    const shading = groups.get(g).some(c => SHADING_IDS.has(c.id));
    const note = shading ? el("div", { class: "group-note" }) : null;
    if (note) panel.groupNotes.push(note);
    body.append(el("div", { class: "group" }, el("h3", {}, prettyGroup(g)),
      el("div", { class: "rows" }, note, groups.get(g).map(c => controlRow(d, c)))));
  }

  // Send pipeline latency of the phone.
  const latencyEl = el("pre", { class: "clock-pre" });
  panel.latencyEl = latencyEl;
  body.append(el("div", { class: "group" }, el("h3", {}, "Latency"), latencyEl));
  updateLatencyPanel(d);

  // Clock discipline of the phone.
  const clockEl = el("pre", { class: "clock-pre" });
  panel.clockEl = clockEl;
  body.append(el("div", { class: "group" }, el("h3", {}, "Clock"), clockEl));
  updateClockPanel(d);

  // Message to the phone.
  const msgInput = el("input", { type: "text", placeholder: "Message to the camera operator" });
  const sendMsg = () => {
    const text = msgInput.value.trim();
    if (!text) return;
    send({ type: "message", device: d.id, text });
    addLog(d.id, "debug", "message sent: " + text);
    msgInput.value = "";
  };
  msgInput.addEventListener("keydown", ev => { if (ev.key === "Enter") sendMsg(); });
  panel.msgButton = el("button", { class: "btn", onclick: sendMsg }, "Send");
  body.append(el("div", { class: "group" }, el("h3", {}, "Message"),
    el("div", { class: "msg" }, msgInput, panel.msgButton)));

  // Log.
  const log = el("div", { id: "log" });
  panel.logEl = log;
  body.append(el("div", { class: "group" }, el("h3", {}, "Log"), log));

  const info = d.info || {};
  const sub = [info.model, info.platform && (info.platform + " " + (info.os_version || "")), info.app_version && ("app " + info.app_version)]
    .filter(Boolean).join(" · ");
  const keyLine = d.keyFingerprint
    ? el("div", { class: "sub", title: "Device key SHA-256 " + d.keyFingerprint }, "key " + shortFingerprint(d.keyFingerprint))
    : el("div", { class: "sub", title: "This camera joined without a device key (an older app)" }, "no device key");
  const forget = CONFIG.devicesUrl
    ? el("button", { class: "btn", onclick: () => forgetDevice(d), title: "Disconnect this camera and revoke its key" }, "Forget")
    : null;
  panel.nameEl = el("span", { class: "name" });
  panel.tags = el("span", { class: "tags" });
  p.replaceChildren(
    el("div", { class: "p-head" },
      el("span", { class: "dot" + (d.online ? " on" : "") }),
      el("div", { style: "min-width:0" },
        el("div", { class: "p-name" }, panel.nameEl, panel.tags), el("div", { class: "sub" }, sub), keyLine),
      forget,
      el("button", { class: "btn close", onclick: closePanel, title: "Close (Esc)" }, "Close")),
    body);
  p.scrollTop = scroll;
  for (const e of d.log) appendLogLine(e);
  updatePanel();
}

function commandWidget(d, c) {
  const argNames = c.args ? Object.keys(c.args) : [];
  const inputs = argNames.map(a => el("input", {
    type: "number", step: "any", placeholder: a, title: a + " (" + c.args[a] + ")",
  }));
  const btn = el("button", {
    class: "btn",
    "data-cmd": c.name,
    onclick: () => {
      const args = {};
      inputs.forEach((inp, i) => {
        if (inp.value !== "") args[argNames[i]] = Number(inp.value);
      });
      sendCommand(d.id, c.name, args);
    },
  }, c.label || c.name);
  return el("span", { class: "cmd" }, btn, inputs);
}

function controlRow(d, c) {
  const why = el("span", { class: "why" });
  const label = el("label", { title: c.id }, el("span", { class: "lt" }, c.label || c.id), why);
  const ctl = el("div", { class: "ctl" });
  const row = el("div", { class: "row" }, label, ctl);
  let update;
  switch (c.kind) {
    case "range": update = rangeControl(d, c, ctl); break;
    case "enum": update = enumControl(d, c, ctl); break;
    case "bool": update = boolControl(d, c, ctl); break;
    case "text": update = textControl(d, c, ctl); break;
    default: {
      const span = el("span", {});
      ctl.append(span);
      update = v => { span.textContent = v === undefined ? "" : JSON.stringify(v); };
    }
  }
  panel.updaters.set(c.id, (value, reason) => {
    const enabled = !reason;
    row.classList.toggle("disabled", !enabled);
    // A camera-wide reason (offline, an app to update) is said once, above.
    const info = enabled ? rowInfo(d, c) : null;
    why.textContent = reason ? (reason.wide ? "" : reason.short) : info ? info.short : "";
    why.classList.toggle("info", !reason);
    row.title = reason ? reason.long : info ? info.long : "";
    update(value, enabled);
  });
  return row;
}

// A note on a control that can be set: mains that differ from the
// production.
function rowInfo(d, c) {
  if (c.id !== "mains_hz") return null;
  const m = mainsNote(d);
  if (!m) return null;
  const prod = Number(production.mains_hz) === 0 ? "off" : production.mains_hz + " Hz";
  return { short: "Production " + prod, long: m.long };
}

function rangeControl(d, c, ctl) {
  const min = Number(c.min ?? 0), max = Number(c.max ?? 100);
  const step = c.step ? Number(c.step) : 0;
  const isLog = c.scale === "log" && min > 0 && max > min;
  const POS = 1000;
  const toPos = v => isLog ? Math.round(Math.log(v / min) / Math.log(max / min) * POS) : v;
  const fromPos = p => {
    let v = isLog ? min * Math.pow(max / min, p / POS) : Number(p);
    if (step > 0) v = min + Math.round((v - min) / step) * step;
    v = Math.min(max, Math.max(min, v));
    return Number(v.toFixed(step > 0 ? decimalsFor(step) : 3));
  };
  const slider = el("input", { type: "range" });
  if (isLog) { slider.min = 0; slider.max = POS; slider.step = 1; }
  else { slider.min = min; slider.max = max; slider.step = step > 0 ? step : "any"; }
  const num = el("input", { class: "num", type: "text", inputmode: "decimal" });
  const unit = el("span", { class: "unit" }, c.unit || "");
  ctl.append(slider, num, unit);

  let dragging = false, settleTimer = null;
  let lastSent = 0, timer = null, queued = null;
  const flush = withId => {
    clearTimeout(timer); timer = null;
    if (queued === null) return;
    lastSent = performance.now();
    sendSet(d.id, { [c.id]: queued }, withId);
    queued = null;
  };
  const showReported = () => {
    const v = d.state[c.id];
    if (typeof v === "number") slider.value = toPos(v);
  };
  // "input" fires while dragging (throttled to ~10/s), "change" on release.
  slider.addEventListener("input", () => {
    dragging = true;
    clearTimeout(settleTimer);
    queued = fromPos(slider.value);
    const wait = 100 - (performance.now() - lastSent);
    if (wait <= 0) flush(false);
    else if (!timer) timer = setTimeout(() => flush(false), wait);
  });
  slider.addEventListener("change", () => {
    queued = fromPos(slider.value);
    flush(true);
    dragging = false;
    // Snap to the reported value once the phone had a moment to answer.
    clearTimeout(settleTimer);
    settleTimer = setTimeout(showReported, 600);
  });
  const applyNum = () => {
    const v = Number(num.value);
    if (num.value.trim() === "" || !isFinite(v)) { num.value = fmtNum(d.state[c.id], step); return; }
    sendSet(d.id, { [c.id]: v }, true);
    num.blur();
  };
  num.addEventListener("keydown", ev => {
    if (ev.key === "Enter") applyNum();
    if (ev.key === "Escape") { num.value = fmtNum(d.state[c.id], step); num.blur(); }
  });
  num.addEventListener("blur", () => { num.value = fmtNum(d.state[c.id], step); });

  return (value, enabled) => {
    slider.disabled = !enabled;
    num.disabled = !enabled;
    if (document.activeElement !== num) num.value = fmtNum(value, step);
    if (!dragging && typeof value === "number") slider.value = toPos(value);
  };
}

function enumControl(d, c, ctl) {
  const opts = c.options || [];
  const shortLabels = opts.every(o => String(o.label ?? o.value).length <= 12);
  if (opts.length <= 6 && shortLabels) {
    const seg = el("div", { class: "seg" });
    const buttons = opts.map(o => el("button", {
      onclick: () => sendSet(d.id, { [c.id]: o.value }, true),
    }, String(o.label ?? o.value)));
    seg.append(...buttons);
    ctl.append(seg);
    // A mode: manual in yellow, auto in blue.
    const isMode = c.id in MODE_GROUP;
    return (value, enabled) => {
      buttons.forEach((b, i) => {
        const active = same(opts[i].value, value);
        b.classList.toggle("active", active);
        b.classList.toggle("held", active && isMode && opts[i].value !== "auto");
        b.disabled = !enabled;
      });
    };
  }
  const sel = el("select", {});
  opts.forEach((o, i) => sel.append(el("option", { value: String(i) }, String(o.label ?? o.value))));
  const unknown = el("option", { value: "" }, "");
  sel.append(unknown);
  sel.addEventListener("change", () => {
    const o = opts[Number(sel.value)];
    if (o) sendSet(d.id, { [c.id]: o.value }, true);
  });
  ctl.append(sel);
  return (value, enabled) => {
    sel.disabled = !enabled;
    const i = opts.findIndex(o => same(o.value, value));
    // A measured value that is not an option (auto modes) still shows.
    unknown.textContent = i < 0 && value !== undefined ? String(value) : "";
    sel.value = i < 0 ? "" : String(i);
  };
}

function boolControl(d, c, ctl) {
  const t = el("button", {
    class: "toggle", role: "switch",
    onclick: () => sendSet(d.id, { [c.id]: d.state[c.id] !== true }, true),
  });
  const txt = el("span", { class: "unit" });
  ctl.append(t, txt);
  return (value, enabled) => {
    t.classList.toggle("on", value === true);
    t.setAttribute("aria-checked", value === true ? "true" : "false");
    t.disabled = !enabled;
    txt.textContent = value === true ? "On" : value === false ? "Off" : "";
  };
}

function textControl(d, c, ctl) {
  const inp = el("input", { type: "text", spellcheck: "false" });
  const apply = el("button", { class: "btn" }, "Apply");
  const go = () => sendSet(d.id, { [c.id]: inp.value }, true);
  apply.addEventListener("click", go);
  inp.addEventListener("keydown", ev => {
    if (ev.key === "Enter") { go(); inp.blur(); }
    if (ev.key === "Escape") { inp.value = d.state[c.id] ?? ""; inp.blur(); }
  });
  ctl.append(inp, apply);
  return (value, enabled) => {
    inp.disabled = !enabled;
    apply.disabled = !enabled;
    if (document.activeElement !== inp) inp.value = value ?? "";
  };
}

function updatePanel() {
  if (!panel) return;
  const d = devices.get(panel.id);
  if (!d) return;
  for (const c of d.controls) {
    const u = panel.updaters.get(c.id);
    if (u) u(d.state[c.id], disabledReason(d, c));
  }
  updateMedia(d, panel.media.img, panel.media.overlay);
  const note = document.getElementById("offline-note");
  if (note) note.textContent = d.online ? "" : "Camera offline. Showing the last known values.";
  for (const n of panel.groupNotes || []) {
    n.textContent = d.online && refusesShading(d) ? "Update app: this version refuses exposure, colour and focus from the hub." : "";
    n.title = n.textContent ? OUTDATED_APP : "";
  }
  document.querySelectorAll("#panel .cmd button").forEach(b => {
    const r = d.online && refusesShading(d) && SHADING_IDS.has(b.dataset.cmd);
    b.disabled = !d.online || r;
    b.title = r ? OUTDATED_APP : "";
  });
  if (panel.tags) setTags(panel.tags, d);
  if (panel.tagChips) setUserTags(panel.tagChips, d, true);
  if (panel.nameEl) setName(panel.nameEl, d);
  if (panel.msgButton) panel.msgButton.disabled = !d.online;
  const dot = document.querySelector("#panel .p-head .dot");
  if (dot) dot.className = "dot" + (d.online ? " on" : "");
}

function appendLogLine(e) {
  if (!panel || !panel.logEl) return;
  const log = panel.logEl;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 20;
  log.append(el("div", { class: "l " + known(LOG_LEVELS, e.level, "info") }, el("span", { class: "t" }, e.t), e.text));
  while (log.childElementCount > LOG_MAX) log.firstElementChild.remove();
  if (atBottom) log.scrollTop = log.scrollHeight;
}

// ---------------------------------------------------------------------------
// Hub messages
// ---------------------------------------------------------------------------

function applySnapshotDevice(s) {
  const d = addDevice(s.id);
  d.info = s.info || d.info;
  d.controls = s.controls || [];
  d.commands = s.commands || [];
  d.state = s.state || {};
  d.status = s.status || null;
  d.preview = s.preview || null;
  d.tally = s.tally || "off";
  d.online = !!s.online;
  d.keyFingerprint = s.key_fingerprint || null;
  d.protocol = s.protocol || 0;
  d.imageStats = (s.online && s.image_stats) || null;
  d.tags = Array.isArray(s.tags) ? s.tags : [];
  d.lastSeen = typeof s.last_seen_s === "number" ? s.last_seen_s : null;
  d.production = s.production || null;
}

// "3f2a 9c1d 7b0e 44a1": the start of the key fingerprint, to compare with
// what the phone shows.
function shortFingerprint(fp) {
  return fp ? fp.slice(0, 16).match(/.{4}/g).join(" ") : "";
}

function removeDevice(id) {
  const d = devices.get(id);
  if (!d) return;
  for (const c of d.cards.values()) { c.root.remove(); if (cardObserver) cardObserver.unobserve(c.root); visibleCards.delete(c.root); }
  for (const r of d.rows.values()) r.root.remove();
  if (d.shade) d.shade.root.remove();
  devices.delete(id);
  const i = order.indexOf(id);
  if (i >= 0) order.splice(i, 1);
  if (selected === id) closePanel();
  renderGrid();
  renderShade();
}

async function forgetDevice(d) {
  const name = (d.info && d.info.name) || d.id;
  if (!confirm("Forget " + name + "? It is disconnected, and it needs a new invite to join again.")) return;
  try {
    const r = await fetch(CONFIG.devicesUrl + "/" + encodeURIComponent(d.id), { method: "DELETE", headers: operatorHeaders() });
    if (!r.ok && r.status !== 404) throw new Error("HTTP " + r.status);
    removeDevice(d.id);
  } catch (e) {
    addLog(d.id, "error", "forget failed: " + (e.message || e));
  }
}

function onMessage(m) {
  const d = typeof m.device === "string" ? devices.get(m.device) : null;
  switch (m.type) {
    case "snapshot": {
      const seen = new Set();
      for (const s of m.devices || []) { applySnapshotDevice(s); seen.add(s.id); }
      // Devices the hub no longer lists were forgotten while this page was
      // away (a restarted hub lists the ones it keeps).
      for (const id of [...devices.keys()]) if (!seen.has(id)) removeDevice(id);
      // The hub's display order.
      setOrder((m.devices || []).map(s => s.id));
      // Controls may have changed meanwhile, as in `device_hello`.
      for (const dev of devices.values()) if (dev.shade && dev.shade.layout !== shadeLayout(dev)) dev.shade.rebuild = true;
      if (m.production) production = m.production;
      renderGrid();
      renderShade();
      // Deep link: open a camera's panel with #<device id>, once.
      if (!selected && deepLink && devices.has(deepLink)) selected = deepLink;
      if (selected === deepLink) deepLink = null;
      if (selected) select(selected);
      // A new connection watches everything until told otherwise.
      watchSent = undefined;
      scheduleWatch();
      return;
    }
    case "device_hello": {
      const nd = addDevice(m.device);
      nd.info = m.info || nd.info;
      nd.controls = m.controls || [];
      nd.commands = m.commands || [];
      nd.keyFingerprint = m.key_fingerprint || null;
      nd.protocol = m.protocol || 0;
      // The hub drops an older app's statistics without an event.
      if (!hasShading(nd)) nd.imageStats = null;
      if (!nd.online) addLog(nd.id, "debug", "online");
      nd.online = true;
      nd.lastSeen = Math.floor(Date.now() / 1000);
      renderGrid();
      // New controls or protocol: the shading card is rebuilt only when
      // what it shows changed, and not in the middle of a drag.
      if (nd.shade && nd.shade.layout !== shadeLayout(nd)) nd.shade.rebuild = true;
      renderShade();
      if (selected === nd.id) buildPanel();
      return;
    }
    case "device_state":
      if (!d) return;
      noteChanges(d, m.values || {});
      Object.assign(d.state, m.values || {});
      updateCard(d);
      if (selected === d.id) updatePanel();
      updateShadeCard(d);
      if ("mains_hz" in (m.values || {})) updateProductionBar();
      return;
    case "device_status":
      if (!d) return;
      d.status = m;
      updateCard(d);
      updateClockPanel(d);
      updateLatencyPanel(d);
      updateShadeCard(d);
      updateProductionBar();
      return;
    case "device_preview":
      if (!d) return;
      d.preview = { jpeg: m.jpeg, width: m.width, height: m.height };
      forCards(d, c => updateMedia(d, c.img, c.overlay));
      if (selected === d.id && panel) updateMedia(d, panel.media.img, panel.media.overlay);
      if (d.shade) updateMedia(d, d.shade.img, d.shade.overlay);
      return;
    case "device_tally":
      if (!d) return;
      d.tally = m.state;
      updateCard(d);
      if (selected === d.id) updatePanel();
      updateShadeCard(d);
      return;
    case "device_offline":
      if (!d) return;
      d.online = false;
      // As the hub does: a stale stream state would read as live.
      d.status = null;
      d.imageStats = null;
      d.isoLimit = null;
      d.lastSeen = typeof m.last_seen_s === "number" ? m.last_seen_s : Math.floor(Date.now() / 1000);
      addLog(d.id, "warn", "offline");
      updateCard(d);
      if (selected === d.id) updatePanel();
      updateShadeCard(d);
      updateProductionBar();
      return;
    case "device_removed":
      removeDevice(m.device);
      return;
    case "device_production":
      if (!d) return;
      d.production = m.production || null;
      updateCard(d);
      if (selected === d.id) updatePanel();
      updateShadeCard(d);
      return;
    case "device_tags":
      if (!d) return;
      d.tags = Array.isArray(m.tags) ? m.tags : [];
      updateCard(d);
      if (selected === d.id) updatePanel();
      scheduleView();
      return;
    case "order":
      setOrder(m.devices || []);
      scheduleView();
      if (view === "shading") renderShade();
      return;
    case "device_result": {
      const p = pending.get(m.id);
      pending.delete(m.id);
      if (d && !m.ok) {
        addLog(d.id, "error", (p ? p.what + ": " : "") + (m.error || "failed"));
        shadeError(d, (p ? p.what + ": " : "") + (m.error || "failed"));
      }
      // Command output, e.g. clock_log: its lines go to the log.
      if (d && m.ok && m.data) {
        if (typeof m.data.reports === "string" && m.data.reports) addLog(d.id, "debug", m.data.reports);
        if (Array.isArray(m.data.lines)) for (const line of m.data.lines) addLog(d.id, "debug", line);
      }
      return;
    }
    case "device_log":
      if (!d) return;
      addLog(d.id, m.level, m.message);
      if (m.level === "warn") { noteIsoLimit(d, m.message); updateCard(d); updateShadeCard(d); }
      return;
    case "device_image_stats":
      if (!d) return;
