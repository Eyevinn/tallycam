name: TallyCam
options:
  bundleIdPrefix: se.eyevinn
  deploymentTarget:
    iOS: "17.0"
packages:
  # Lock-free indices of the microphone's sample ring (the audio I/O thread
  # must not lock).
  swift-atomics:
    url: https://github.com/apple/swift-atomics
    # Pinned: the generated project (and its Package.resolved) is not
    # committed, so the version is fixed here.
    exactVersion: 1.3.1
# Linking the Rust core (core/ffi): static library and headers built by
# scripts/build-core-apple.sh into build/core/ (repository root) for the platform being built.
settingGroups:
  core_settings: &core_settings
    SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/../build/core/include
    LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../build/core/lib/$(PLATFORM_NAME)
    OTHER_LDFLAGS: -ltallycam_core_ffi
    ENABLE_USER_SCRIPT_SANDBOXING: NO
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  TallyCam:
    type: application
    platform: iOS
    sources:
      - TallyCam
      # Generated by scripts/build-core-apple.sh (pre-build script below).
      - path: ../build/core/swift/TallyCamCore.swift
        optional: true
        group: Core
    dependencies:
      - package: swift-atomics
        product: Atomics
    # Written by XcodeGen (not committed) and merged with the generated keys
    # (GENERATE_INFOPLIST_FILE). Registers the provisioning deep link scheme;
    # keep it equal to ProvisioningLink.scheme and the hub's DEEP_LINK_SCHEME.
    info:
      path: Config/TallyCam-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: se.eyevinn.tallycam.connect
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - tallycam
        # Measurement output (Documents/torch-probe) in the Files app and Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    preBuildScripts:
      - name: Build Rust core
        script: '"$PROJECT_DIR/../scripts/build-core-apple.sh" "$PLATFORM_NAME"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/../build/core/swift/TallyCamCore.swift
          - $(PROJECT_DIR)/../build/core/lib/$(PLATFORM_NAME)/libtallycam_core_ffi.a
    settings:
      base:
        <<: *core_settings
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tallycam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TallyCam
        INFOPLIST_KEY_NSCameraUsageDescription: TallyCam sends the camera to a Strom server.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: TallyCam sends the microphone to a Strom server.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: TallyCam connects to a Strom server on the local network.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  # Unit tests for the Swift-side logic (core hot path, SEI, the core muxer, messages,
  # orientation). Not hosted: the files under test are compiled into the bundle,
  # so no app launch is needed. The clock discipline itself is tested in Rust
  # (cargo test in core/).
  TallyCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TallyCamTests
      - TallyCam/Control/LcpMessages.swift
      - TallyCam/Control/DeviceKey.swift
      - TallyCam/Control/Provisioning.swift
      - TallyCam/Control/ManualExposure.swift
      - TallyCam/Core/ClockSummary.swift
      - TallyCam/Core/CoreHotPath.swift
      - TallyCam/Encoding/AudioCodec.swift
      - TallyCam/Audio/AudioTiming.swift
      - TallyCam/Encoding/AudioEncoder.swift
      - TallyCam/Encoding/VideoEncoder.swift
      - TallyCam/Stream/LatencyMeter.swift
      - TallyCam/Stream/CoreTsMuxer.swift
      - TallyCam/Srt/SrtUrl.swift
      # The UniFFI bindings: SrtUrl parses with the core.
      - path: ../build/core/swift/TallyCamCore.swift
        optional: true
        group: Core
      - TallyCam/Orientation.swift
      - TallyCam/CameraFormats.swift
      - TallyCam/Control/TorchProbeAnalysis.swift
      # LcpMessages reports the capture calibration.
      - TallyCam/CaptureCalibration.swift
    preBuildScripts:
      - name: Build Rust core
        script: '"$PROJECT_DIR/../scripts/build-core-apple.sh" "$PLATFORM_NAME"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        <<: *core_settings
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tallycam.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TallyCam:
    build:
      targets:
        TallyCam: all
    run:
      config: Debug
    archive:
      config: Release
  TallyCamTests:
    build:
      targets:
        TallyCamTests: [test]
    test:
      config: Debug
      targets:
        - TallyCamTests
